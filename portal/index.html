      offered:all.filter(t=>!t.archived && t.status==='offered').length,
      accepted:all.filter(t=>!t.archived && t.status==='accepted').length,
      declined:all.filter(t=>!t.archived && t.status==='declined').length,
      archived:all.filter(t=>t.archived).length
    };
    const list = Inbox.apply(all,s,(r,tab)=>{
      if(tab === 'archived') return r.archived;
      if(r.archived) return false;
      if(tab === 'open') return ['new','valuing','offered'].indexOf(r.status) > -1;
      return r.status === tab;
    });

    return `
    ${H.head('Trade-In Requests',`${counts.new} waiting to be valued.`)}

    <div class="stats" style="margin-bottom:14px">
      ${H.stat({label:'Waiting to be valued',count:counts.new,icon:'swap',tone:counts.new?'dan':'ok'})}
      ${H.stat({label:'Offers made',count:counts.offered,icon:'tag',tone:'warn'})}
      ${H.stat({label:'Accepted',count:counts.accepted,icon:'checkCircle',tone:'ok',
        sub:'<span>Cars you bought</span>'})}
      ${H.stat({label:'Value of offers made',
        value:U.money(all.filter(t=>!t.archived&&t.offer).reduce((n,t)=>n+t.offer,0)),icon:'calc'})}
    </div>

    ${Inbox.filterBar(s,counts,[
      {k:'open',l:'Open'},{k:'new',l:'New'},{k:'offered',l:'Offer made'},
      {k:'accepted',l:'Accepted'},{k:'declined',l:'Declined'},{k:'archived',l:'Archived'}
    ])}

    ${list.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
      ${list.map(t=>`
        <div class="card" data-open="${t.id}" style="cursor:pointer${t.status==='new'?';border-color:var(--acc)':''}">
          ${t.images && t.images.length
            ? `<div style="aspect-ratio:16/10;background:var(--raise-2);overflow:hidden">
                 <img src="${U.esc(t.images[0])}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">
               </div>`
            : ''}
          <div class="card-b">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
              <div style="min-width:0">
                <b style="display:block;font-size:14px;font-weight:700">${U.esc([t.year,t.make,t.model].filter(Boolean).join(' ')||'Vehicle')}</b>
                <small style="display:block;font-size:11.5px;color:var(--text-3)">${U.esc(t.variant||'')}</small>
              </div>
              ${statusPill(t.status)}
            </div>
            <div class="kv" style="margin-top:12px;gap:7px">
              <div class="kv-row"><span>Mileage</span><b>${t.mileage?U.km(t.mileage):'—'}</b></div>
              <div class="kv-row"><span>Condition</span><b>${U.esc(t.condition||'—')}</b></div>
              <div class="kv-row"><span>They hope for</span><b>${t.expected?U.money(t.expected):'—'}</b></div>
              ${t.offer?`<div class="kv-row"><span>Our offer</span><b style="color:var(--ok)">${U.money(t.offer)}</b></div>`:''}
              ${t.hasFinance?`<div class="kv-row"><span>Finance owing</span><b style="color:var(--warn)">Yes</b></div>`:''}
            </div>
            <div class="sep" style="margin:12px 0"></div>
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
              ${Inbox.who(t)}
              <small style="font-size:11px;color:var(--text-3);flex-shrink:0">${U.ago(t.createdAt)}</small>
            </div>
          </div>
        </div>`).join('')}
    </div>`
    : H.card('','',H.empty('swap',
        s.q ? 'Nothing matches that search' : 'No trade-in requests here',
        s.q ? 'Try a different name or number.'
            : 'Valuation requests from the sell my car page on the website arrive here.'))}`;
  },

  mount(root){
    const s = this.state;
    Inbox.wireSearch(root,s);
    U.on(root,'click','[data-tab]',(e,b)=>{ s.tab = b.dataset.tab; Router.refresh(); });
    U.on(root,'click','[data-open]',(e,card)=>{
      const r = Store.find('tradeins',card.dataset.open);
      if(!r) return;
      Inbox.detail('tradeins',r,{
        logTitle:'Trade-in',
        statusOpts:[
          {v:'new',l:'New'},{v:'valuing',l:'We are valuing it'},{v:'offered',l:'Offer made'},
          {v:'accepted',l:'They accepted'},{v:'declined',l:'They declined'}
        ],
        waText:`Hello ${r.name||''}, this is Super Cars Witbank about the ${[r.year,r.make,r.model].filter(Boolean).join(' ')} you asked us to value.`,
        rows:[
          ['Vehicle',U.esc([r.year,r.make,r.model,r.variant].filter(Boolean).join(' ')||'—')],
          ['Mileage',r.mileage?U.km(r.mileage):'—'],
          ['Transmission',U.esc(r.transmission||'—')],
          ['Fuel',U.esc(r.fuel||'—')],
          ['Condition',U.esc(r.condition||'—')],
          ['Finance outstanding',r.hasFinance?'<span style="color:var(--warn)">Yes, needs settling</span>':'No'],
          ['They hope to get',r.expected?U.money(r.expected):'Not said'],
          ['Telephone',r.phone?`<a href="tel:${U.esc(U.telHref(r.phone))}" style="color:var(--acc-2)">${U.esc(r.phone)}</a>`:'—'],
          ['Email',r.email?`<a href="mailto:${U.esc(r.email)}" style="color:var(--acc-2)">${U.esc(r.email)}</a>`:'—'],
          ['Received',U.dateTime(r.createdAt)]
        ],
        extra:
          (r.images && r.images.length ? `<div>
            <label style="font-size:12px;font-weight:700;color:var(--text-2);display:block;margin-bottom:8px">
              Photographs they sent (${r.images.length})</label>
            <div class="upl-grid">${r.images.map((src,i)=>
              `<div class="upl-item" data-ti-view="${i}" style="cursor:zoom-in">
                 <img src="${U.esc(src)}" alt="" loading="lazy"></div>`).join('')}</div>
          </div>` : `<div class="note info">${ICON.info}<div>They did not attach any photographs.
             You will need to see the car before making a firm offer.</div></div>`)+
          H.field('Your offer (R)',H.input('offer',r.offer,'0','number'),
            'Recorded here for your own reference. It is not sent to the customer automatically.')
      });

      /* The photograph grid is inside the shared dialog, so it is wired
         after that dialog has mounted. */
      setTimeout(()=>{
        const mod = U.el('#modalRoot .mod:last-child');
        if(!mod) return;
        U.on(mod,'click','[data-ti-view]',(ev,el)=>UI.lightbox(r.images,Number(el.dataset.tiView)));
      },80);
    });
  }
});

/* ==================================================================
   MODULE  ·  Testimonials
   The reviews the website shows. Deliberately separate from the Google
   rating in Business Information: that figure is what Google holds,
   these are reviews staff have chosen to reproduce.
   ================================================================== */
Portal.register({
  id:'testimonials', title:'Testimonials', sub:'Reviews on your website', icon:'star',
  group:'Customers', instant:true,
  state:{ tab:'all' },

  render(){
    const s = this.state;
    const all = Store.list('testimonials');
    const counts = {
      all:all.filter(t=>!t.archived).length,
      published:all.filter(t=>!t.archived && t.published !== false).length,
      featured:all.filter(t=>!t.archived && t.featured).length,
      hidden:all.filter(t=>!t.archived && t.published === false).length,
      archived:all.filter(t=>t.archived).length
    };
    const list = all.filter(t=>{
      if(s.tab === 'archived') return t.archived;
      if(t.archived) return false;
      if(s.tab === 'published') return t.published !== false;
      if(s.tab === 'featured')  return t.featured;
      if(s.tab === 'hidden')    return t.published === false;
      return true;
    });

    const shown = all.filter(t=>!t.archived && t.published !== false);
    const avg = shown.length
      ? (shown.reduce((n,t)=>n+(Number(t.rating)||0),0)/shown.length).toFixed(1) : '—';

    const biz = Store.doc('business');

    return `
    ${H.head('Testimonials',`${counts.published} published on the website.`,`
      <button class="btn btn-pri" data-act="add">${ICON.plus} Add a review</button>`)}

    <div class="stats" style="margin-bottom:14px">
      ${H.stat({label:'Published on the website',count:counts.published,icon:'star',tone:'warn'})}
      ${H.stat({label:'Average of those shown',value:avg===('—')?'—':avg+' out of 5',icon:'starFill',tone:'ok',
        sub:shown.length?U.stars(Math.round(Number(avg))):'<span>Nothing published yet</span>'})}
      ${H.stat({label:'Featured on the home page',count:counts.featured,icon:'home'})}
      ${H.stat({label:'Your Google rating',value:biz.googleRating?biz.googleRating+' out of 5':'Not set',
        icon:'globe',tone:'acc',
        sub:`<span>${biz.googleReviews?biz.googleReviews+' reviews. Edit in Business Information.':'Set it in Business Information.'}</span>`})}
    </div>

    ${!counts.published ? `<div class="note info" style="margin-bottom:14px">${ICON.info}
      <div>Nothing is published yet, so the reviews section on the website hides itself and the
      reviews page points customers at your Google listing instead. Add a review below to
      change that. Only reproduce reviews people actually gave you.</div></div>` : ''}

    <div class="card" style="margin-bottom:14px"><div class="card-b">
      <div class="tabs">
        ${[{k:'all',l:'All'},{k:'published',l:'Published'},{k:'featured',l:'Featured'},
           {k:'hidden',l:'Hidden'},{k:'archived',l:'Archived'}].map(t=>
          `<button class="tab ${s.tab===t.k?'on':''}" data-tab="${t.k}">${t.l}<span class="n">${counts[t.k]||0}</span></button>`).join('')}
      </div>
    </div></div>

    ${list.length ? `<div class="grid" id="tmgrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
      ${list.map(t=>`
        <div class="card" data-id="${t.id}" draggable="true">
          <div class="card-b">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
              ${U.stars(t.rating,14)}
              <div class="sp" style="gap:4px">
                ${t.featured?'<span class="pill acc">Featured</span>':''}
                ${t.published === false?'<span class="pill warn">Hidden</span>':''}
                ${t.archived?'<span class="pill">Archived</span>':''}
              </div>
            </div>
            <p style="font-size:13.5px;line-height:1.6;color:var(--text-2);margin-top:11px;
                      display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden">
              ${U.esc(t.review||'No review text')}</p>
            <div class="sep" style="margin:13px 0"></div>
            <div style="display:flex;align-items:center;gap:11px">
              <div class="avatar" style="width:36px;height:36px;font-size:12.5px;overflow:hidden">
                ${t.photo?`<img src="${U.esc(t.photo)}" alt="" style="width:100%;height:100%;object-fit:cover">`:U.esc(U.initials(t.name))}
              </div>
              <div style="min-width:0;flex:1">
                <b style="display:block;font-size:13px;font-weight:690;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(t.name||'No name')}</b>
                <small style="display:block;font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc([t.vehicle,t.location].filter(Boolean).join(' · ')||t.source)}</small>
              </div>
              <button class="icon-act" data-edit="${t.id}" title="Edit">${ICON.edit}</button>
            </div>
          </div>
        </div>`).join('')}
    </div>
    <p class="hint" style="margin-top:14px;text-align:center">Drag a card to change the order they appear in on the website.</p>`
    : H.card('','',H.empty('star','No reviews here',
        'Add the reviews customers have actually given you. Only reproduce real ones.',
        `<button class="btn btn-pri btn-sm" data-act="add">${ICON.plus} Add a review</button>`))}`;
  },

  mount(root){
    const s = this.state;
    U.on(root,'click','[data-tab]',(e,b)=>{ s.tab = b.dataset.tab; Router.refresh(); });
    U.on(root,'click','[data-act="add"]',()=>Modules.testimonialForm(null));
    U.on(root,'click','[data-edit]',(e,b)=>Modules.testimonialForm(Store.find('testimonials',b.dataset.edit)));

    const grid = U.el('#tmgrid',root);
    if(grid) UI.sortable(grid,'.card[data-id]',ids=>{
      const full = Store.list('testimonials');
      const moved = ids.map(id=>full.find(t=>t.id===id)).filter(Boolean);
      const rest = full.filter(t=>ids.indexOf(t.id) < 0);
      Store.replaceAll('testimonials',moved.concat(rest));
      UI.toast('ok','Order saved','The website will show them in this order');
    });
  }
});

Modules.testimonialForm = function(t){
  const isNew = !t;
  const d = Object.assign({
    id:'', name:'', vehicle:'', location:'', rating:5, review:'', photo:'',
    source:'Google', featured:false, published:true, archived:false
  }, t ? JSON.parse(JSON.stringify(t)) : {});

  UI.modal({
    title:isNew ? 'Add a review' : 'Edit review',
    sub:isNew ? 'Only reproduce reviews a customer actually gave you.' : (d.name||''),
    sticky:true,
    body:'<div data-tf></div>',
    footer:
      (isNew?'':'<button class="btn btn-ghost" data-tf-del>'+ICON.trash+' Delete</button>')+
      '<div style="flex:1"></div>'+
      '<button class="btn" data-tf-cancel>Cancel</button>'+
      '<button class="btn btn-pri" data-tf-save>'+ICON.check+' '+(isNew?'Add review':'Save')+'</button>',
    onMount(body,close,foot){
      paint();

      function paint(){
        U.el('[data-tf]',body).innerHTML = `
          <div class="grid" style="gap:13px">
            <div class="f2">
              ${H.field('Customer name',H.input('name',d.name,'Their name as they gave it'),'','required')}
              ${H.field('Town or area',H.input('location',d.location,'eMalahleni'))}
            </div>
            ${H.field('Vehicle they bought',H.input('vehicle',d.vehicle,'2021 Toyota Fortuner'))}
            <div class="f2">
              ${H.field('Rating',`<div class="sp" data-tf-stars style="gap:4px">
                ${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}"
                  style="width:30px;height:30px;color:${n<=d.rating?'#F5A623':'var(--line-2)'}"
                  aria-label="${n} star${n===1?'':'s'}">${ICON.starFill}</button>`).join('')}
                <span style="font-size:12.5px;color:var(--text-3);margin-left:6px">${d.rating} out of 5</span>
              </div>`)}
              ${H.field('Where it came from',H.sel('source',d.source,['Google','Facebook','Direct','WhatsApp','In person']),
                'Only "Google" shows the Google badge on the website.')}
            </div>
            ${H.field('What they said',H.ta('review',d.review,'Paste their review exactly as they wrote it.',5),'','required')}
            ${H.field('Their photograph',`
              <div class="sp">
                ${d.photo?`<img src="${U.esc(d.photo)}" alt="" style="width:52px;height:52px;border-radius:999px;object-fit:cover">`:
                  `<div class="avatar" style="width:52px;height:52px;font-size:17px">${U.esc(U.initials(d.name))}</div>`}
                <button class="btn btn-sm" data-tf-photo>${ICON.upload} ${d.photo?'Replace':'Add a photograph'}</button>
                ${d.photo?`<button class="btn btn-sm btn-ghost" data-tf-nophoto>Remove</button>`:''}
              </div>
              <input type="file" accept="image/*" hidden data-tf-file>`,
              'Optional. Without one their initials are shown instead.')}
            <div class="sep"></div>
            <div class="grid" style="gap:9px">
              ${H.toggleCard('published',d.published,'Published','Shown on the website','ok','globe')}
              ${H.toggleCard('featured',d.featured,'Featured','Shown on the home page','acc','home')}
              ${H.toggleCard('archived',d.archived,'Archived','Hidden everywhere, but kept','warn','archive')}
            </div>
          </div>`;
        wire();
      }

      function wire(){
        const pane = U.el('[data-tf]',body);
        H.bind(pane,(k,v)=>{ d[k] = v; },()=>{});

        U.on(pane,'click','[data-star]',(e,b)=>{ d.rating = Number(b.dataset.star); paint(); });

        const file = U.el('[data-tf-file]',pane);
        const btn = U.el('[data-tf-photo]',pane);
        if(btn && file){
          btn.addEventListener('click',()=>file.click());
          file.addEventListener('change',U.guard(async()=>{
            const f = file.files[0];
            if(!f) return;
            try{
              const img = await U.readImage(f,420,.85);
              const up = await Cloud.uploadImage('branding',img.dataUrl,'reviews');
              d.photo = up.url;
              Store.insert('media',{
                id:U.id('m'), url:up.url, bucket:up.bucket, path:up.path,
                name:(d.name||'Customer')+' photo', folder:'testimonials',
                kind:'image', bytes:up.bytes, width:img.width, height:img.height
              });
              paint();
              UI.toast('ok','Photograph added','');
            }catch(err){ UI.toast('err','That did not upload',err.message); }
            file.value = '';
          }));
        }
        const rm = U.el('[data-tf-nophoto]',pane);
        if(rm) rm.addEventListener('click',()=>{ d.photo = ''; paint(); });
      }

      U.el('[data-tf-cancel]',foot).addEventListener('click',close);

      const del = U.el('[data-tf-del]',foot);
      if(del) del.addEventListener('click',U.guard(async()=>{
        if(await UI.confirm({title:'Delete this review?',
          message:'It is removed from the website and from your records.',
          confirmText:'Delete',tone:'dan'})){
          Store.remove('testimonials',d.id);
          Store.log('Review deleted',d.name||'','trash','dan');
          close(); Router.refresh();
          UI.toast('ok','Deleted','');
        }
      }));

      U.el('[data-tf-save]',foot).addEventListener('click',U.guard(async()=>{
        if(!d.name || !d.review){
          UI.toast('err','A name and the review are needed','Both are shown on the website.');
          return;
        }
        if(isNew){
          d.id = U.id('t');
          Store.insert('testimonials',d);
          Store.log('Review added',d.name,'star','ok');
        }else{
          Store.update('testimonials',d.id,d);
          Store.log('Review updated',d.name,'edit');
        }
        close(); Router.refresh();
        UI.toast('ok','Saved',d.published?'It is on the website now.':'Saved but not published.');
      }));
    }
  });
};

/* ==================================================================
   MODULE  ·  Media Library
   An index of everything in Storage, so the library can list, rename and
   delete without walking the bucket on every page load.
   ================================================================== */
Portal.register({
  id:'media', title:'Media Library', sub:'Every photograph on your website', icon:'image',
  group:'Inventory', skeleton:'cards',
  state:{ folder:'all', q:'' },

  render(){
    const s = this.state;
    const all = Store.list('media');
    const folders = ['vehicles','hero','branding','testimonials','tradein','general'];
    const counts = { all:all.length };
    folders.forEach(f=>counts[f] = all.filter(m=>m.folder===f).length);

    let list = s.folder === 'all' ? all.slice() : all.filter(m=>m.folder === s.folder);
    if(s.q){
      const q = s.q.toLowerCase();
      list = list.filter(m=>(m.name||'').toLowerCase().indexOf(q) > -1);
    }
    list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

    const bytes = all.reduce((n,m)=>n+(Number(m.bytes)||0),0);
    const usedBy = Modules.mediaUsage();
    const orphans = all.filter(m=>!usedBy[m.url]).length;

    return `
    ${H.head('Media Library',`${all.length} files, ${fmtBytes(bytes)} in storage.`,`
      <button class="btn btn-pri" data-act="upload">${ICON.upload} Upload</button>`)}

    <div class="stats" style="margin-bottom:14px">
      ${H.stat({label:'Files stored',count:all.length,icon:'image',tone:'acc'})}
      ${H.stat({label:'Storage used',value:fmtBytes(bytes),icon:'db',
        sub:'<span>Supabase free tier gives you 1 GB</span>'})}
      ${H.stat({label:'Vehicle photographs',count:counts.vehicles||0,icon:'car'})}
      ${H.stat({label:'Not used anywhere',count:orphans,icon:'warn',tone:orphans?'warn':'ok',
        sub:orphans?'<span>Safe to delete</span>':'<span>Everything is in use</span>'})}
    </div>

    <div class="card" style="margin-bottom:14px"><div class="card-b"
         style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <div class="tabs" style="flex:1;min-width:220px">
        <button class="tab ${s.folder==='all'?'on':''}" data-folder="all">All<span class="n">${counts.all}</span></button>
        ${folders.filter(f=>counts[f]).map(f=>
          `<button class="tab ${s.folder===f?'on':''}" data-folder="${f}">${f[0].toUpperCase()+f.slice(1)}<span class="n">${counts[f]}</span></button>`).join('')}
      </div>
      <input class="inp" id="mq" placeholder="Search by name" value="${U.esc(s.q)}" style="width:auto;min-width:190px">
      ${orphans?`<button class="btn btn-sm" data-act="tidy">${ICON.trash} Remove unused (${orphans})</button>`:''}
    </div></div>

    ${list.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(168px,1fr))">
      ${list.map(m=>{
        const used = usedBy[m.url];
        return `<div class="card">
          <div style="position:relative;aspect-ratio:4/3;background:var(--raise-2);cursor:zoom-in"
               data-view="${U.esc(m.url)}">
            <img src="${U.esc(m.url)}" alt="${U.esc(m.name)}" loading="lazy"
                 style="width:100%;height:100%;object-fit:cover">
            ${!used?'<span class="pill warn" style="position:absolute;top:7px;left:7px">Unused</span>':''}
          </div>
          <div class="card-b" style="padding:10px">
            <b style="display:block;font-size:12px;font-weight:650;overflow:hidden;
                      text-overflow:ellipsis;white-space:nowrap">${U.esc(m.name||'Untitled')}</b>
            <small style="display:block;font-size:10.5px;color:var(--text-3);margin-top:2px">
              ${m.width?m.width+'×'+m.height+' · ':''}${fmtBytes(m.bytes)}</small>
            ${used?`<small style="display:block;font-size:10.5px;color:var(--ok);margin-top:3px;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap">In use: ${U.esc(used)}</small>`:''}
            <div class="sp" style="margin-top:9px;gap:3px">
              <button class="icon-act" data-rename="${m.id}" title="Rename">${ICON.edit}</button>
              <button class="icon-act" data-copy="${U.esc(m.url)}" title="Copy the link">${ICON.copy}</button>
              <div style="flex:1"></div>
              <button class="icon-act dan" data-del="${m.id}" title="Delete">${ICON.trash}</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`
    : H.card('','',H.empty('image',
        s.q ? 'Nothing matches that' : 'Nothing in this folder',
        s.q ? 'Try a different name.'
            : 'Photographs you add to a vehicle appear here automatically. You can also upload directly.',
        `<button class="btn btn-pri btn-sm" data-act="upload">${ICON.upload} Upload</button>`))}`;
  },

  mount(root){
    const s = this.state;
    U.on(root,'click','[data-folder]',(e,b)=>{ s.folder = b.dataset.folder; Router.refresh(); });
    U.on(root,'click','[data-view]',(e,b)=>UI.lightbox([b.dataset.view],0));
    U.on(root,'click','[data-act="upload"]',()=>Modules.uploadMedia());

    const q = U.el('#mq',root);
    if(q) q.addEventListener('input',U.debounce(()=>{
      s.q = q.value; Router.refresh();
      const again = U.el('#mq');
      if(again){ again.focus(); again.setSelectionRange(again.value.length,again.value.length); }
    },300));

    U.on(root,'click','[data-copy]',(e,b)=>{
      const url = b.dataset.copy;
      if(navigator.clipboard){
        navigator.clipboard.writeText(url)
          .then(()=>UI.toast('ok','Link copied',''))
          .catch(()=>UI.toast('err','Could not copy','Your browser blocked it.'));
      }else{
        UI.toast('err','Could not copy','Your browser does not support this.');
      }
    });

    U.on(root,'click','[data-rename]',(e,b)=>{
      const m = Store.find('media',b.dataset.rename);
      if(!m) return;
      UI.modal({
        title:'Rename',
        body:H.field('Name',H.input('name',m.name,''),'Only used here in the library. The web address does not change.'),
        footer:'<button class="btn" data-x>Cancel</button><button class="btn btn-pri" data-ok>Save</button>',
        onMount(body,close,foot){
          const input = U.el('[data-k="name"]',body);
          U.el('[data-x]',foot).addEventListener('click',close);
          U.el('[data-ok]',foot).addEventListener('click',()=>{
            Store.update('media',m.id,{name:input.value.trim()});
            close(); Router.refresh();
            UI.toast('ok','Renamed','');
          });
        }
      });
    });

    U.on(root,'click','[data-del]',U.guard(async(e,b)=>{
      const m = Store.find('media',b.dataset.del);
      if(!m) return;
      const usedBy = Modules.mediaUsage();
      const used = usedBy[m.url];
      if(await UI.confirm({
        title:'Delete this file?',
        message:'It is removed from storage permanently.',
        note:used ? 'This file is used by '+used+'. Deleting it will leave a broken picture on the website.'
                  : 'Nothing on the website uses this file.',
        confirmText:'Delete',tone:'dan'
      })){
        await Cloud.removeImage(m.url);
        Store.remove('media',m.id);
        Store.log('File deleted',m.name||'','trash','dan');
        Router.refresh();
        UI.toast('ok','Deleted','');
      }
    }));

    U.on(root,'click','[data-act="tidy"]',U.guard(async()=>{
      const usedBy = Modules.mediaUsage();
      const orphans = Store.list('media').filter(m=>!usedBy[m.url]);
      if(!orphans.length) return;
      if(await UI.confirm({
        title:`Remove ${orphans.length} unused file${orphans.length===1?'':'s'}?`,
        message:'These are not referenced by any vehicle, review or website setting.',
        note:'They are deleted from storage permanently. This cannot be undone.',
        confirmText:`Delete ${orphans.length}`,tone:'dan'
      })){
        for(const m of orphans){
          await Cloud.removeImage(m.url);
          Store.remove('media',m.id);
        }
        Store.log('Unused files removed',orphans.length+' deleted','trash','warn');
        Router.refresh();
        UI.toast('ok','Tidied up',orphans.length+' file'+(orphans.length===1?'':'s')+' removed');
      }
    }));
  }
});

/* Works out which record uses each stored file, so the library can warn
   before a deletion breaks a page and can offer to tidy what is genuinely
   unreferenced. */
Modules.mediaUsage = function(){
  const used = {};
  Store.list('vehicles').forEach(v=>{
    (v.images||[]).forEach(u=>{ used[u] = vehName(v); });
  });
  Store.list('testimonials').forEach(t=>{
    if(t.photo) used[t.photo] = 'Review by '+(t.name||'a customer');
  });
  Store.list('tradeins').forEach(t=>{
    (t.images||[]).forEach(u=>{ used[u] = 'Trade-in from '+(t.name||'a customer'); });
  });
  ['business','homepage','about'].forEach(k=>{
    const doc = Store.doc(k);
    JSON.stringify(doc).replace(/https?:\/\/[^"\\ ]+/g,m=>{
      if(Cloud.isStored(m)) used[m] = 'Website settings';
      return m;
    });
  });
  return used;
};

Modules.uploadMedia = function(){
  UI.modal({
    title:'Upload files',
    sub:'Pictures are resized automatically before they are stored.',
    body:`
      ${H.field('Put them in',`<select class="sel" data-k="folder">
        ${['general','hero','branding','vehicles','testimonials'].map(f=>
          `<option value="${f}">${f[0].toUpperCase()+f.slice(1)}</option>`).join('')}
      </select>`,'Only used to keep the library tidy.')}
      <div class="upl-drop" data-up-drop tabindex="0" role="button" style="margin-top:14px">
        ${ICON.upload}<b>Choose pictures</b><span>Or drag them here</span>
      </div>
      <input type="file" accept="image/*" multiple hidden data-up-file>
      <div data-up-log style="margin-top:12px"></div>`,
    footer:'<button class="btn" data-x>Close</button>',
    onMount(body,close,foot){
      const drop = U.el('[data-up-drop]',body);
      const file = U.el('[data-up-file]',body);
      const log  = U.el('[data-up-log]',body);
      const folderSel = U.el('[data-k="folder"]',body);

      U.el('[data-x]',foot).addEventListener('click',()=>{ close(); Router.refresh(); });
      drop.addEventListener('click',()=>file.click());
      drop.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); file.click(); }
      });
      ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
        e.preventDefault(); drop.classList.add('over');
      }));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
        e.preventDefault(); drop.classList.remove('over');
      }));
      drop.addEventListener('drop',e=>take(e.dataTransfer.files));
      file.addEventListener('change',()=>{ take(file.files); file.value=''; });

      async function take(files){
        const list = Array.prototype.slice.call(files||[]).filter(f=>/^image\//.test(f.type));
        if(!list.length){ UI.toast('err','No pictures found','Only image files can be uploaded.'); return; }
        const folder = folderSel.value;
        let done = 0;
        log.innerHTML = `<div class="note info">${ICON.info}<div>Uploading ${list.length}…</div></div>`;
        for(const f of list){
          try{
            const img = await U.readImage(f, folder==='hero' ? 2000 : 1600, .84);
            const up = await Cloud.uploadImage(folder==='vehicles'?'vehicle-images':'branding',
              img.dataUrl, folder);
            Store.insert('media',{
              id:U.id('m'), url:up.url, bucket:up.bucket, path:up.path,
              name:f.name.replace(/\.[^.]+$/,''), folder:folder,
              kind:'image', bytes:up.bytes, width:img.width, height:img.height
            });
            done++;
            log.innerHTML = `<div class="note ok">${ICON.checkCircle}<div>${done} of ${list.length} uploaded.</div></div>`;
          }catch(err){
            log.innerHTML = `<div class="note dan">${ICON.warn}<div>${U.esc(f.name)} failed: ${U.esc(err.message)}</div></div>`;
          }
        }
        if(done){
          Store.log('Files uploaded',done+' added to the library','upload','ok');
          UI.toast('ok','Uploaded',done+' file'+(done===1?'':'s')+' added');
        }
      }
    }
  });
};

function fmtBytes(n){
  n = Number(n)||0;
  if(!n) return '0 KB';
  if(n < 1024) return n+' B';
  if(n < 1048576) return Math.round(n/1024)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}

      function panel(title,tKey,txtKey,ctaKey){
        const cta = d[ctaKey] || {};
        return H.card(title,'',`
          <div class="grid" style="gap:13px">
            ${H.field('Heading',H.input(tKey,d[tKey],''))}
            ${H.field('Text',H.ta(txtKey,d[txtKey],'',2))}
            <div class="f2">
              ${H.field('Button text',H.input(ctaKey+'.text',cta.text,''))}
              ${H.field('Button link',H.input(ctaKey+'.link',cta.link,''))}
            </div>
          </div>`);
      }

  },

  mount(root){
    const s = this.state;
    const d = Store.doc('homepage');

    U.on(root,'click','[data-tab]',(e,b)=>{ s.tab = b.dataset.tab; Router.refresh(); });
    U.on(root,'click','[data-act="preview"]',()=>window.open(WEBSITE_URL,'_blank','noopener'));

    const save = ()=>{
      Store.saveDoc('homepage');
      Store.log('Homepage edited','The home page has been updated','home');
    };

    /* Dotted keys such as ctaPrimary.text and sections.hero write into the
       nested object rather than creating a key with a full stop in it. */
    H.bind(root,(k,v)=>{
      if(k.indexOf('.') > -1){
        const [a,b] = k.split('.');
        if(!d[a] || typeof d[a] !== 'object') d[a] = {};
        d[a][b] = v;
      }else{
        d[k] = v;
      }
    },save);

    /* Per-make logo overrides, keyed by the make itself. */
    U.on(root,'input','[data-logo]',U.debounce((e,el)=>{
      if(!d.makeLogos) d.makeLogos = {};
      const v = el.value.trim();
      if(v) d.makeLogos[el.dataset.logo] = v;
      else delete d.makeLogos[el.dataset.logo];
      save();
    },480));

    /* Hero photograph. */
    const file = U.el('[data-hero-file]',root);
    const pick = U.el('[data-hero-pic]',root);
    if(pick && file){
      pick.addEventListener('click',()=>file.click());
      file.addEventListener('change',U.guard(async()=>{
        const f = file.files[0];
        if(!f) return;
        try{
          const img = await U.readImage(f,2200,.84);
          const up = await Cloud.uploadImage('branding',img.dataUrl,'hero');
          d.heroPhoto = up.url;
          Store.insert('media',{
            id:U.id('m'), url:up.url, bucket:up.bucket, path:up.path,
            name:'Hero background', folder:'hero', kind:'image',
            bytes:up.bytes, width:img.width, height:img.height
          });
          save(); Router.refresh();
          UI.toast('ok','Hero photograph set','It sits behind the glow on the home page.');
        }catch(err){ UI.toast('err','That did not upload',err.message); }
        file.value = '';
      }));
    }
    const drop = U.el('[data-hero-nopic]',root);
    if(drop) drop.addEventListener('click',()=>{
      d.heroPhoto = ''; save(); Router.refresh();
      UI.toast('ok','Photograph removed','The hero uses its built-in background.');
    });

    /* The repeaters on this tab, in the order they were rendered. */
    const keys = this.reps[s.tab];
    if(keys){
      keys.forEach(k=>{ if(!Array.isArray(d[k])) d[k] = []; });
      bindMulti(root,d,keys,save);
    }
  }
});

    const save = ()=>{
      Store.saveDoc(docKey);
      Store.log('Website content edited',
        {about:'About page',finance:'Finance page',sell:'Sell my car page',
         contact:'Contact page',navigation:'Navigation',footer:'Footer',
         legal:'Legal pages'}[docKey],'doc');
    };

    H.bind(root,(k,v)=>{
      /* A few fields are edited as text but stored as an array. */

      else if(k === 'pointsText')  d.points = String(v).split('\n').map(x=>x.trim()).filter(Boolean);
      else if(k === 'termOptionsText'){
        d.termOptions = String(v).split(',').map(x=>Number(String(x).trim()))
                         .filter(n=>n > 0).sort((a,b)=>a-b);
      }
      else d[k] = v;
    },save);

    /* The repeaters on the About, Finance and Sell tabs. */
    const arrays = {
      about:['values','timeline','team'], finance:['steps'], sell:['steps'], nav:['items']
    }[s.tab];
    if(arrays){
      /* Every repeater on the page shares one delegated handler, so the
         active array is worked out from the row that was clicked. Only one
         repeater kind is ever on screen at a time per card, so binding each
         array in turn is safe. */
      arrays.forEach(key=>{
        if(!Array.isArray(d[key])) d[key] = [];
      });
      bindMulti(root,d,arrays,save);
    }

    /* Footer columns are a nested structure, so they get their own wiring. */
    if(s.tab === 'footer'){
      if(!Array.isArray(d.columns)) d.columns = [];
      U.on(root,'input','[data-col]',U.debounce((e,el)=>{
        const [i,field] = el.dataset.col.split('.');
        if(!d.columns[i]) return;
        if(field === 'title') d.columns[i].title = el.value;
        else d.columns[i].links = el.value.split('\n').map(line=>{
          const [label,link] = line.split('|');
          return { label:(label||'').trim(), link:(link||'').trim() };
        }).filter(l=>l.label);
        save();
      },480));
      U.on(root,'click','[data-col-add]',()=>{
        d.columns.push({title:'New column',links:[]});
        save(); Router.refresh();
      });
      U.on(root,'click','[data-col-del]',U.guard(async(e,b)=>{
        if(await UI.confirm({title:'Remove this column?',
          message:'It disappears from the footer on every page.',confirmText:'Remove',tone:'dan'})){
          d.columns.splice(Number(b.dataset.colDel),1);
          save(); Router.refresh();
        }
      }));
    }
  }
});

/* Binds several repeaters on one page. Each repeater renders inside its own
   card, so the array a control belongs to is found by walking up to the
   nearest [data-rep-host] and matching it by index. */
function bindMulti(root,doc,keys,save){
  const hosts = U.els('[data-rep-host]',root);
  hosts.forEach((host,i)=>{
    const key = keys[i];
    if(!key) return;
    H.bindRepeater(host,()=>doc[key],save,()=>Router.refresh());
  });
}

      ${H.card('Your logo','Two files, because the header sits on white and the footer on black',`
        <div class="grid" style="gap:16px">

              For the header, on a light background</label>
            <div class="sp" style="align-items:flex-end">
              ${d.logo
                ? `<img src="${U.esc(d.logo)}" alt="" style="height:52px;background:#fff;padding:6px;border-radius:9px">`

              <button class="btn btn-sm" data-logo>${ICON.upload} ${d.logo?'Replace':'Upload'}</button>

            </div>
            <div style="margin-top:11px">${H.field('Or paste a link',H.input('logo',d.logo,''))}</div>
          </div>

          <div class="sep"></div>

          <div>
            <label style="font-size:12px;font-weight:700;color:var(--text-2);display:block;margin-bottom:9px">
              For the footer, on a dark background</label>
            <div class="sp" style="align-items:flex-end">
              ${d.logoLight
                ? `<img src="${U.esc(d.logoLight)}" alt="" style="height:52px;background:#111;padding:6px;border-radius:9px">`
                : `<div class="sb-mark" style="width:52px;height:52px">SC</div>`}
              <button class="btn btn-sm" data-logo2>${ICON.upload} ${d.logoLight?'Replace':'Upload'}</button>
              ${d.logoLight?'<button class="btn btn-sm btn-ghost" data-nologo2>Remove</button>':''}
              <input type="file" accept="image/*" hidden data-logo2-file>
            </div>
            <div style="margin-top:11px">${H.field('Or paste a link',H.input('logoLight',d.logoLight,''))}</div>
            <p class="hint" style="margin-top:9px">The same artwork with the black ink lifted to
            white, so the outline and the tagline do not disappear against the dark footer.
            Without one the header version is used.</p>
          </div>
        </div>`)}
    </div>`;
  },

  mount(root){
    const d = Store.doc('business');
    const save = ()=>{
      Store.saveDoc('business');
      Store.log('Business details edited','Updated across the whole website','phone');
    };

    H.bind(root,(k,v)=>{
      if(k.indexOf('social.') === 0){
        if(!d.social) d.social = {};
        d.social[k.split('.')[1]] = v;
      }else{
        d[k] = v;
        /* Keep the one-line address in step unless it has been written by
           hand, so the footer never disagrees with the fields above it. */
        if(['address1','address2','province','postcode'].indexOf(k) > -1){
          const built = [d.address1,d.address2,d.province,d.postcode].filter(Boolean).join(', ');
          if(!d._addressEdited) d.addressFull = built;
        }
        if(k === 'addressFull') d._addressEdited = true;
      }
    },save);

    /* Opening hours have their own shape, so they are wired separately. */
    U.on(root,'change','[data-hr]',(e,el)=>{
      const [i,field] = el.dataset.hr.split('.');
      if(!d.hours[i]) return;
      d.hours[i][field] = el.type === 'checkbox' ? el.checked : el.value;
      save();
      if(field === 'closed') Router.refresh();
    });
    U.on(root,'input','input[type="time"][data-hr]',U.debounce((e,el)=>{
      const [i,field] = el.dataset.hr.split('.');
      if(!d.hours[i]) return;
      d.hours[i][field] = el.value;
      save();
    },400));

    /* Logo */
    const file = U.el('[data-logo-file]',root);
    const btn = U.el('[data-logo]',root);
    if(btn && file){
      btn.addEventListener('click',()=>file.click());
      file.addEventListener('change',U.guard(async()=>{
        const f = file.files[0];
        if(!f) return;
        try{
          const img = await U.readImage(f,600,.9);
          const up = await Cloud.uploadImage('branding',img.dataUrl,'brand');
          d.logo = up.url;
          Store.insert('media',{
            id:U.id('m'), url:up.url, bucket:up.bucket, path:up.path,
            name:'Logo', folder:'branding', kind:'image',
            bytes:up.bytes, width:img.width, height:img.height
          });
          save(); Router.refresh();
          UI.toast('ok','Logo updated','It now appears in the header and footer.');
        }catch(err){ UI.toast('err','That did not upload',err.message); }
        file.value = '';
      }));
    }
    const rm = U.el('[data-nologo]',root);
    if(rm) rm.addEventListener('click',()=>{
      d.logo = ''; save(); Router.refresh();
      UI.toast('ok','Logo removed','The SC monogram is shown instead.');
    });

    /* The dark-background version, uploaded the same way. */
    const file2 = U.el('[data-logo2-file]',root);
    const btn2 = U.el('[data-logo2]',root);
    if(btn2 && file2){
      btn2.addEventListener('click',()=>file2.click());
      file2.addEventListener('change',U.guard(async()=>{
        const f = file2.files[0];
        if(!f) return;
        try{
          const img = await U.readImage(f,900,.92);
          const up = await Cloud.uploadImage('branding',img.dataUrl,'brand');
          d.logoLight = up.url;
          Store.insert('media',{
            id:U.id('m'), url:up.url, bucket:up.bucket, path:up.path,
            name:'Logo, for dark backgrounds', folder:'branding', kind:'image',
            bytes:up.bytes, width:img.width, height:img.height
          });
          save(); Router.refresh();
          UI.toast('ok','Footer logo updated','');
        }catch(err){ UI.toast('err','That did not upload',err.message); }
        file2.value = '';
      }));
    }
    const rm2 = U.el('[data-nologo2]',root);
    if(rm2) rm2.addEventListener('click',()=>{
      d.logoLight = ''; save(); Router.refresh();
      UI.toast('ok','Removed','The header logo is used in the footer instead.');
    });
  }
});

/* ==================================================================
   MODULE  ·  SEO
   One entry per public page, plus the defaults. What is written here is
   what search engines and a shared link show.
   ================================================================== */
Portal.register({
  id:'seo', title:'SEO', sub:'How you appear in search results', icon:'globe',
  group:'Website', instant:true,
  state:{ page:'index' },

  render(){
    const d = Store.doc('seo');
    if(!d.pages) d.pages = {};
    const s = this.state;

    const pages = [
      ['index','Home page','index.html'],
      ['inventory','Stock list','inventory.html'],
      ['vehicle','Vehicle pages','vehicle.html'],
      ['finance','Finance','finance.html'],
      ['sell','Sell my car','sell.html'],
      ['about','About','about.html'],
      ['testimonials','Reviews','testimonials.html'],
      ['contact','Contact','contact.html'],
      ['privacy','Privacy policy','privacy.html'],
      ['terms','Terms of use','terms.html'],
      ['notfound','Page not found','404.html']
    ];
    const cur = d.pages[s.page] || {};
    const meta = pages.find(p=>p[0] === s.page) || pages[0];

    /* How many pages are actually filled in, so the gap is obvious. */
    const done = pages.filter(p=>(d.pages[p[0]]||{}).title && (d.pages[p[0]]||{}).description).length;

    const titleLen = (cur.title||'').length;
    const descLen  = (cur.description||'').length;

    return `
    ${H.head('SEO','What Google shows, and what appears when someone shares a link.')}

    <div class="stats" style="margin-bottom:14px">
      ${H.stat({label:'Pages described',count:done,icon:'doc',tone:done===pages.length?'ok':'warn',
        sub:`<span>of ${pages.length}</span>`})}
      ${H.stat({label:'Vehicles with their own title',
        count:Store.list('vehicles').filter(v=>v.metaTitle).length,icon:'car',
        sub:'<span>The rest build one from the specification</span>'})}
      ${H.stat({label:'Indexing',value:(d.robots||'index,follow').indexOf('noindex')>-1?'Blocked':'Allowed',
        icon:'globe',tone:(d.robots||'index,follow').indexOf('noindex')>-1?'dan':'ok'})}
      ${H.stat({label:'Structured data',value:'On',icon:'sparkles',tone:'ok',
        sub:'<span>Business, rating and vehicle prices</span>'})}
    </div>

    <div class="grid" style="gap:14px">
      ${H.card('Site wide','Used on every page unless a page overrides it',`
        <div class="grid" style="gap:13px">
          <div class="f2">
            ${H.field('Site name',H.input('siteName',d.siteName,'Super Cars Witbank'))}
            ${H.field('Added after every title',H.input('titleSuffix',d.titleSuffix,' | Super Cars Witbank'))}
          </div>
          ${H.field('Sharing picture',H.input('defaultImage',d.defaultImage,''),
            'Shown when a link is shared on WhatsApp or Facebook. 1200 by 630 works best.')}
          ${H.field('Search engine instruction',H.sel('robots',d.robots||'index,follow',
            [{v:'index,follow',l:'Allow indexing (normal)'},{v:'noindex,nofollow',l:'Block indexing (while building)'}]),
            'Leave this on Allow unless the site is not ready to be found.')}
        </div>`)}

      ${H.card('Page by page','',`
        <div class="tabs" style="margin-bottom:16px">
          ${pages.map(([k,l])=>{
            const filled = (d.pages[k]||{}).title && (d.pages[k]||{}).description;
            return `<button class="tab ${s.page===k?'on':''}" data-page="${k}">${l}${filled?'':' <span class="n">!</span>'}</button>`;
          }).join('')}
        </div>
        <div class="grid" style="gap:13px">
          <p class="hint">Editing <b>${U.esc(meta[1])}</b> &middot; ${U.esc(meta[2])}
          ${s.page==='vehicle'?' — this is the fallback. A vehicle with its own title in the vehicle editor uses that instead.':''}</p>
          ${H.field('Page title',H.input('p.title',cur.title,''),
            (titleLen>60?'That is '+titleLen+' characters. Google usually cuts off around 60.':
             titleLen?titleLen+' characters. Around 60 is ideal.':'Around 60 characters is ideal.'))}
          ${H.field('Search description',H.ta('p.description',cur.description,'',3),
            (descLen>160?'That is '+descLen+' characters. Google usually cuts off around 155.':
             descLen?descLen+' characters. Around 155 is ideal.':'Around 155 characters is ideal.'))}
          ${H.field('Keywords',H.input('p.keywords',cur.keywords,''),
            'Comma separated. Search engines largely ignore these now, but they cost nothing.')}
        </div>
        <div class="sep" style="margin:16px 0"></div>
        <label style="font-size:12px;font-weight:700;color:var(--text-2);display:block;margin-bottom:8px">
          How it will look in Google</label>
        <div style="border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;background:var(--bg-2)">
          <div style="font-size:12px;color:var(--ok)">${U.esc((Store.doc('business').website||'https://www.supercars-witbank.co.za').replace(/^https?:\/\//,''))} › ${U.esc(meta[2])}</div>
          <div style="font-size:17px;color:#8AB4F8;margin-top:3px;line-height:1.3">${U.esc((cur.title||meta[1])+(d.titleSuffix||''))}</div>
          <div style="font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.5">${U.esc(cur.description||'No description written yet. Google will pick something from the page itself, which is rarely what you would choose.')}</div>
        </div>`)}

      ${H.card('Files search engines look for','',`
        <div class="kv">
          <div class="kv-row"><span>robots.txt</span><b class="pill ok">In the website folder</b></div>
          <div class="kv-row"><span>sitemap.xml</span><b class="pill ok">In the website folder</b></div>
          <div class="kv-row"><span>Business structured data</span><b class="pill ok">On every page</b></div>
          <div class="kv-row"><span>Vehicle structured data</span><b class="pill ok">On every priced vehicle</b></div>
        </div>
        <p class="hint" style="margin-top:13px">The sitemap lists the fixed pages. Vehicle pages are
        deliberately left out of it because stock changes weekly and a sitemap full of sold cars is
        worse than none. They are still found through the stock list.</p>`)}
    </div>`;
  },

  mount(root){
    const d = Store.doc('seo');
    const s = this.state;
    if(!d.pages) d.pages = {};

    U.on(root,'click','[data-page]',(e,b)=>{ s.page = b.dataset.page; Router.refresh(); });

    H.bind(root,(k,v)=>{
      if(k.indexOf('p.') === 0){
        if(!d.pages[s.page]) d.pages[s.page] = {};
        d.pages[s.page][k.slice(2)] = v;
      }else{
        d[k] = v;
      }
    },()=>{
      Store.saveDoc('seo');
      Store.log('SEO edited','Search settings updated','globe');
    });

    /* The character counters and the Google preview are part of the render,
       so redraw as the writer types rather than only when they stop. */
    const live = U.debounce(()=>{
      const focus = document.activeElement;
      const key = focus && focus.dataset ? focus.dataset.k : null;
      const pos = focus && focus.selectionStart;
      Router.refresh();
      if(key){
        const again = U.el('[data-k="'+key+'"]');
        if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
      }
    },700);
    U.on(root,'input','[data-k="p.title"],[data-k="p.description"]',()=>live());
  }
});

/* ==================================================================
   MODULE  ·  Users
   Staff accounts and what each may do. Creating the account itself is a
   Supabase Authentication job; this page controls the access that comes
   after it, which is what the database actually checks.
   ================================================================== */
Portal.register({
  id:'users', title:'Users', sub:'Who may sign in, and what they may do', icon:'users',
  group:'System', instant:true,

  render(){
    const list = Store.list('users');
    const me = Cloud.userId || (Cloud.session && Cloud.session.userId) || '';
    const admin = Cloud.role === 'admin';

    const ROLES = {
      admin:  ['Administrator','Everything, including managing staff accounts'],
      manager:['Manager','Everything except managing staff accounts'],
      sales:  ['Sales','Stock, enquiries, finance and trade-ins. Not settings.']
    };

    if(!admin) return `
      ${H.head('Users','Staff accounts and permissions.')}
      ${H.card('','',H.empty('shield','Only an administrator may manage staff',
        'You are signed in as '+(ROLES[Cloud.role]?ROLES[Cloud.role][0]:'staff')+
        '. Ask an administrator if someone needs access changed.'))}`;
    /* Local mode grants the administrator role, so this branch is only reached
       by a real signed-in account that is not an administrator. */

    return `
    ${H.head('Users',`${list.filter(u=>u.active).length} active of ${list.length}.`,`
      <button class="btn btn-pri" data-act="invite">${ICON.plus} Add someone</button>`)}

    <div class="note info" style="margin-bottom:14px">${ICON.info}
      <div>Access is granted by this list, not by simply having an account. Somebody who signs
      in without a row here sees nothing at all, which is deliberate.</div></div>

    ${list.length ? `<div class="card"><div class="card-b flush"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Person</th><th>Role</th><th>What they may do</th><th>Added</th><th>Status</th><th style="width:80px"></th></tr></thead>
      <tbody>${list.map(u=>`
        <tr>
          <td><div class="veh-row">
            <div class="avatar" style="width:34px;height:34px;font-size:12px">${U.esc(U.initials(u.name||u.email))}</div>
            <div style="min-width:0"><b>${U.esc(u.name||'No name set')}${u.id===me?' <span class="pill acc">You</span>':''}</b>
            <small>${U.esc(u.email||'')}</small></div>

Modules.restoreBackup = function(){
  UI.modal({
    title:'Restore from a backup',
    sub:'Everything currently in the portal is replaced.',
    body:`
      <div class="note dan" style="margin-bottom:14px">${ICON.warn}
        <div>This replaces your stock, reviews, leads and website copy with whatever is in the
        file. Download a backup of what you have now before you go ahead.</div></div>
      <div class="upl-drop" data-rs-drop tabindex="0" role="button">
        ${ICON.upload}<b>Choose a backup file</b><span>The .json file you downloaded</span>
      </div>
      <input type="file" accept=".json,application/json" hidden data-rs-file>
      <div data-rs-info style="margin-top:14px"></div>`,
    footer:'<button class="btn" data-x>Cancel</button>'+
           '<button class="btn btn-dan" data-ok disabled>Replace everything</button>',
    onMount(body,close,foot){
      let payload = null;
      const drop = U.el('[data-rs-drop]',body);
      const file = U.el('[data-rs-file]',body);
      const info = U.el('[data-rs-info]',body);
      const ok = U.el('[data-ok]',foot);

      U.el('[data-x]',foot).addEventListener('click',close);
      drop.addEventListener('click',()=>file.click());
      drop.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); file.click(); }
      });
      ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
        e.preventDefault(); drop.classList.add('over');
      }));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
        e.preventDefault(); drop.classList.remove('over');
      }));
      drop.addEventListener('drop',e=>read(e.dataTransfer.files[0]));
      file.addEventListener('change',()=>read(file.files[0]));

      function read(f){
        if(!f) return;
        const fr = new FileReader();
        fr.onerror = ()=>UI.toast('err','Could not read that file','');
        fr.onload = ()=>{
          try{
            const parsed = JSON.parse(fr.result);
            const data = parsed.data || parsed;
            if(!data || !Array.isArray(data.vehicles)) throw new Error('shape');
            payload = data;
            info.innerHTML = `<div class="note ok">${ICON.checkCircle}<div>
              Backup from <b>${U.esc(U.dateTime(parsed.takenAt)||'an unknown date')}</b>
              ${parsed.takenBy?' by '+U.esc(parsed.takenBy):''}.<br>
              ${data.vehicles.length} vehicles, ${(data.testimonials||[]).length} reviews,
              ${(data.enquiries||[]).length} enquiries.</div></div>`;
            ok.disabled = false;
          }catch(e){
            payload = null;
            ok.disabled = true;
            info.innerHTML = `<div class="note dan">${ICON.warn}<div>That is not a portal
              backup file. Choose the .json file the Download a backup button produced.</div></div>`;
          }
        };
        fr.readAsText(f);
      }

      ok.addEventListener('click',U.guard(async()=>{
        if(!payload) return;
        if(!await UI.confirm({
          title:'Replace everything?',
          message:'Your current stock, reviews, leads and website copy are overwritten.',
          note:'This cannot be undone.',
          confirmText:'Yes, replace it all',tone:'dan'
        })) return;

        ok.setAttribute('aria-busy','true');
        Store.data = Object.assign(Store.blank(),payload);
        Store.cache();
        /* Push everything back to Supabase so the website matches. */
        ['vehicles','testimonials','enquiries','financeApps','tradeins','media','activity']
          .forEach(k=>Store.list(k).forEach((r,i)=>Cloud.pushRecord(k,r,i)));
        Cloud.pushSettings();
        Store.log('Backup restored','Everything was replaced from a backup file','upload','warn');
        close();
        UI.toast('ok','Restored','Sending it all to the database now.');
        Router.refresh();
      }));
    }
  });
};

              ['finance_applications',Store.list('financeApps').length,'Finance Applications','Written by the finance form'],
              ['tradein_requests',Store.list('tradeins').length,'Trade-In Requests','Written by the sell form'],
              ['media',Store.list('media').length,'Media Library','Photographs on every page'],
              ['vehicle_views',Store.list('views').length,'Analytics','Written when a vehicle page opens'],
              ['portal_users',Store.list('users').length,'Users','Never. Staff only.'],
              ['activity_log',Store.list('activity').length,'Activity Log','Never. Staff only.'],

        <div class="grid" style="gap:11px">
          ${[
            ['The vehicle is a draft','Open it in Vehicle Management and switch Draft off.'],
            ['Changes are still sending','The status pill at the top right says Sending. Wait for Online.'],
            ['The website is caching','It reuses a read for five minutes. Reload the page after that.'],
            ['The website is not configured','js/config.js still has the placeholder values in it.']
          ].map(([a,b])=>`<div class="kv-row" style="align-items:flex-start">
            <span style="flex:1"><b style="color:var(--text);display:block;font-size:13px">${a}</b>
              <small style="color:var(--text-3)">${b}</small></span></div>`).join('')}

  mount(root){
    U.on(root,'click','[data-act="pull"]',U.guard(async(e)=>{
      const btn = e.currentTarget;
      btn.setAttribute('aria-busy','true');
      if(Cloud.queue.length){
        if(!await UI.confirm({
          title:'There are unsent changes',
          message:'Reloading now would replace them with what is in the database.',
          note:'Send them first with the other button, then reload.',
          confirmText:'Reload anyway',tone:'dan'

      try{
        await Cloud.pullAll();
        Router.refresh();

      }catch(err){
        btn.removeAttribute('aria-busy');
        UI.toast('err','Could not reload',err.message);

    U.on(root,'click','[data-act="push"]',U.guard(async()=>{
      await Cloud.flush();
      Router.refresh();
      UI.toast(Cloud.queue.length?'warn':'ok',
        Cloud.queue.length?'Some are still waiting':'All sent',
        Cloud.queue.length?Cloud.lastError:'The database is up to date.');
    }));

});

/* ==================================================================
   MODULE  ·  Activity Log
   ================================================================== */
Portal.register({
  id:'activity', title:'Activity Log', sub:'Everything that has changed', icon:'activity',
  group:'System', instant:true,
  state:{ q:'' },

  render(){
    const s = this.state;
    let list = Store.list('activity');
    if(s.q){
      const q = s.q.toLowerCase();
      list = list.filter(a=>(a.title+' '+a.detail+' '+a.actor).toLowerCase().indexOf(q) > -1);
    }

    /* Group by day, which is how anyone actually reads a log. */
    const groups = {};
    list.forEach(a=>{
      const d = new Date(a.at);
      const key = isNaN(d) ? 'Unknown' : d.toDateString();
      (groups[key] = groups[key]||[]).push(a);
    });
    const today = new Date().toDateString();
    const yesterday = new Date(Date.now()-86400000).toDateString();

    return `
    ${H.head('Activity Log',`${Store.list('activity').length} entries kept.`,
      Cloud.can('settings')?`<button class="btn btn-ghost" data-act="clear">${ICON.trash} Clear the log</button>`:'')}

    <div class="card" style="margin-bottom:14px"><div class="card-b">
      <input class="inp" id="aq" placeholder="Search the log" value="${U.esc(s.q)}">
    </div></div>

    ${Object.keys(groups).length ? Object.keys(groups).map(day=>`
      <div class="card" style="margin-bottom:14px">
        <div class="card-h"><h3>${day===today?'Today':day===yesterday?'Yesterday':U.esc(day)}</h3>
          <p>${groups[day].length} change${groups[day].length===1?'':'s'}</p></div>
        <div class="card-b tight">
          ${groups[day].map(a=>`
            <div class="list-item" style="padding:11px 4px">
              <div class="li-ic ${a.tone||'acc'}">${ICON[a.icon]||ICON.activity}</div>
              <div class="li-b"><b>${U.esc(a.title)}</b>
                <small>${U.esc(a.detail||'')}${a.actor?' · '+U.esc(a.actor):''}</small></div>
              <div class="li-t">${new Date(a.at).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'})}</div>
            </div>`).join('')}
        </div>
      </div>`).join('')
    : H.card('','',H.empty('activity',
        s.q?'Nothing matches that':'Nothing recorded yet',
        s.q?'Try a different word.':'Changes you make in the portal are listed here.'))}`;
  },

  mount(root){
    const s = this.state;
    const q = U.el('#aq',root);
    if(q) q.addEventListener('input',U.debounce(()=>{
      s.q = q.value; Router.refresh();
      const again = U.el('#aq');
      if(again){ again.focus(); again.setSelectionRange(again.value.length,again.value.length); }
    },300));

    U.on(root,'click','[data-act="clear"]',U.guard(async()=>{
      if(await UI.confirm({
        title:'Clear the activity log?',
        message:'This only clears the history list. Your website and your records are untouched.',
        confirmText:'Clear the log',tone:'warn'
      })){
        const ids = Store.list('activity').map(a=>a.id);
        Store.data.activity = [];
        ids.forEach(id=>Cloud.pushDelete('activity',id));
        Store.cache();
        Router.refresh();
        UI.toast('ok','Cleared','');
      }
    }));
  }
});

       things still to do rather than as faults, because running locally is the
       deliberate current state. */

      Cloud.configured ? Cloud.base
        : 'Not connected yet. The portal is running on the content that ships with the '+
          'website, and changes stay in this browser.',
      'database');
    add(Cloud.authed, true, 'Signed in',
      Cloud.authed ? 'As '+Cloud.email
        : 'The sign-in screen has been taken out for now, so nobody is signed in and '+
          'nothing can be written to a database.',

    if(Cloud.configured){
      add(!Cloud.queue.length, Cloud.queue.length > 0, 'Everything has been sent',
        Cloud.queue.length ? Cloud.queue.length+' change'+(Cloud.queue.length===1?'':'s')+' still waiting.'
          : 'Nothing is waiting to be sent.', 'database');

    const failed = checks.filter(c=>!c.ok && !c.warn).length;

    return `

    <div class="stats" style="margin-bottom:14px">

      ${H.stat({label:'Worth fixing',count:warned,icon:'warn',tone:warned?'warn':'ok'})}
      ${H.stat({label:'Problems',count:failed,icon:'warn',tone:failed?'dan':'ok'})}

    ${failed ? `<div class="note dan" style="margin-bottom:14px">${ICON.warn}
      <div>${failed} thing${failed===1?' is':'s are'} stopping part of the website working properly.

    ${H.card('Checks','Tap any row to go and fix it',
      checks.map(c=>`
        <button class="list-item" ${c.go?`data-go="${c.go}"`:''}

          <div class="li-ic ${c.ok?'ok':c.warn?'warn':'dan'}">

        <div class="tbl-wrap"><table class="tbl" style="min-width:600px">
          <thead><tr><th>Page</th><th>Where its content comes from</th><th>Status</th></tr></thead>
          <tbody>
            ${[

              ['Stock list','Vehicle Management',st.available>0],
              ['Vehicle page','Vehicle Management, Website Content (finance defaults)',st.available>0],
              ['Finance','Website Content, and applications go to Finance Applications',!!Store.doc('finance').title],
              ['Sell my car','Website Content, and requests go to Trade-In Requests',!!Store.doc('sell').title],

              ['Privacy','Website Content',!!legal.privacyBody],
              ['Terms','Website Content',!!legal.termsBody],

            ].map(([page,src,ok])=>`<tr>
              <td><b style="font-size:13px">${page}</b></td>
              <td><small style="color:var(--text-3)">${src}</small></td>
              <td>${ok?'<span class="pill ok">Ready</span>':'<span class="pill warn">Incomplete</span>'}</td>
            </tr>`).join('')}
          </tbody>

        <p class="hint" style="margin-top:13px">There is nothing on the website that is not in this

  },

  mount(root){
    U.on(root,'click','[data-go]',(e,b)=>location.hash = '#/'+b.dataset.go);

/* ==================================================================
   8. ROUTER
   ================================================================== */
const Router = {
  current:null,

  /* Which modules this account may even see. The database enforces the
     same rules, so hiding them here is a courtesy rather than the
     protection: a sales account that typed the address by hand would get
     an empty page rather than data. */
  allowed(mod){
    if(['homepage','content','business','seo','announce'].indexOf(mod.id) > -1) return Cloud.can('settings');
    if(mod.id === 'users') return Cloud.role === 'admin';
    return true;
  },

  buildNav(){
    const groups = [];
    Portal.modules.filter(m=>Router.allowed(m)).forEach(m=>{
      const g = m.group || 'General';
      let grp = groups.find(x=>x.name === g);
      if(!grp){ grp = {name:g,items:[]}; groups.push(grp); }
      grp.items.push(m);
    });

    /* buildNav runs again after a re-login or a pull, and #sbNav is
       permanent, so swap it for a clone to drop the old click handler
       rather than stacking another one on top. */
    const oldNav = U.el('#sbNav');
    const nav = oldNav.cloneNode(false);
    oldNav.parentNode.replaceChild(nav,oldNav);

    nav.innerHTML = groups.map(g=>`
      <div class="sb-group">${U.esc(g.name)}</div>
      ${g.items.map(m=>`
        <button class="sb-link" data-nav="${m.id}">
          ${ICON[m.icon]||ICON.dash}
          <span>${U.esc(m.title)}</span>
          <span data-badge="${m.id}"></span>
        </button>`).join('')}`).join('');

    U.on(nav,'click','[data-nav]',(e,b)=>{
      location.hash = '#/'+b.dataset.nav;
      Shell.closeSidebar();
    });
    this.paintBadges();
  },

  paintBadges(){
    const st = Store.stats();
    Portal.modules.forEach(m=>{
      const slot = U.el(`[data-badge="${m.id}"]`);
      if(!slot) return;
      const b = m.badge ? m.badge(st) : null;
      slot.outerHTML = b
        ? `<span class="sb-badge ${b.mut?'mut':''}" data-badge="${m.id}">${U.esc(b.text)}</span>`
        : `<span data-badge="${m.id}"></span>`;
    });
  },

  go(id,params){
    let mod = Portal.byId[id];
    if(!mod || !Router.allowed(mod)) mod = Portal.byId.dashboard;
    this.current = mod.id;

    U.els('.sb-link').forEach(b=>b.classList.toggle('on',b.dataset.nav === mod.id));
    U.el('#tbTitle').innerHTML = `<b>${U.esc(mod.title)}</b><small>${U.esc(mod.sub||'')}</small>`;
    document.title = mod.title+' · Super Cars Portal';

    /* Swap #view for a shallow clone before every render. Modules bind
       delegated listeners to this node in mount(), and mount() runs again on
       every navigation and every refresh. Reusing the node stacked a fresh
       set of listeners each time, so after N renders one click fired its
       handler N times and opened N identical dialogs. Replacing the node
       discards the old listeners along with it. */
    let view = U.el('#view');
    const fresh = view.cloneNode(false);
    view.parentNode.replaceChild(fresh,view);
    view = fresh;
    view.classList.remove('anim');
    view.innerHTML = UI.skeleton(mod.skeleton||'list',5);

    const paint = ()=>{
      try{
        view.innerHTML = mod.render(params||{});
      }catch(err){
        console.error('[render] '+mod.id,err);
        view.innerHTML = H.card('Something went wrong on this page','',
          `<div class="note dan">${ICON.warn}<div>${U.esc(err.message)}</div></div>
           <div class="sp" style="margin-top:14px">
             <button class="btn" onclick="location.reload()">Reload the portal</button>
             <a class="btn btn-ghost" href="#/dashboard">Back to the dashboard</a>
           </div>`);
        return;
      }
      void view.offsetWidth;
      view.classList.add('anim');
      if(mod.mount){
        try{ mod.mount(view,params||{}); }
        catch(err){ console.error('[mount] '+mod.id,err); }
      }
      UI.animateAll(view);
      Router.paintBadges();
      window.scrollTo({top:0,behavior:'instant'});
    };

    if(mod.instant) paint();
    else setTimeout(paint,140);
  },

  refresh(){ if(this.current) this.go(this.current,this._params||{}); },

  start(){
    const read = ()=>{
      const h = (location.hash||'').replace(/^#\/?/,'');
      const [id,query] = h.split('?');
      const params = {};
      (query||'').split('&').filter(Boolean).forEach(p=>{
        const [k,v] = p.split('=');
        params[decodeURIComponent(k)] = decodeURIComponent(v||'');
      });
      this._params = params;
      this.go(id||'dashboard',params);
    };
    window.addEventListener('hashchange',read);
    read();
  }
};

/* ==================================================================
   9. SHELL  -  login, chrome, boot
   ================================================================== */
const Shell = {
  openSidebar(){ U.el('#sidebar').classList.add('on'); U.el('#scrim').classList.add('on'); },
  closeSidebar(){ U.el('#sidebar').classList.remove('on'); U.el('#scrim').classList.remove('on'); },

  paintStatus(){
    const pill = U.el('#syncPill');
    if(!pill) return;
    const span = pill.querySelector('span');
    pill.classList.remove('syncing','offline');

    /* Nothing connected yet. Say so, rather than showing a reassuring green
       dot over changes that are only in this browser. */
    if(!Cloud.configured || !Cloud.authed){
      pill.classList.add('offline');
      span.textContent = 'Local only';
      pill.title = Cloud.configured
        ? 'Not signed in. Changes are saved in this browser only.'
        : 'No database connected. Changes are saved in this browser only.';
      return;
    }

    if(Cloud.status === 'syncing'){
      pill.classList.add('syncing');
      span.textContent = Cloud.queue.length ? 'Sending '+Cloud.queue.length : 'Sending…';
    }else if(Cloud.status === 'online'){
      span.textContent = 'Online';
    }else{
      pill.classList.add('offline');
      span.textContent = 'Offline';
    }
    pill.title = Cloud.lastError || 'Everything is reaching the database';
  },

  /* Sends the portal back to the sign-in screen. Never leaves the app visible
     without a session behind it.

     With no Supabase project configured there is nothing to sign in to, so
     the portal stays open in local mode instead and says so. */
  lock(message){
    if(!Cloud.configured){
      Cloud.role = LOCAL_ROLE;
      Shell.paintStatus();
      if(message) UI.toast('warn','Signed out',message);
      return;
    }
    U.el('#app').classList.remove('on');
    U.el('#login').classList.remove('hide');
    const err = U.el('#loginErr');
    if(message){ err.textContent = message; err.classList.add('on'); }
    const pass = U.el('#loginPass');
    if(pass) pass.value = '';
  },

  async enter(){
    /* With a project configured, a session is required. Without one the portal
       opens on the content built into the website and cannot write anywhere,
       so there is nothing to protect. */
    if(Cloud.configured){
      if(!Cloud.authed) return Shell.lock();

      const role = await Cloud.whoAmI();
      if(role === null){
        UI.toast('warn','Working offline',
          'Could not reach the database. You are seeing the copy stored on this device.');
      }else if(!role){
        await Cloud.signOut();
        return Shell.lock('That account is not on the staff list, so it cannot see anything. '+
          'An administrator needs to add it under Users.');
      }
    }else{
      Cloud.role = LOCAL_ROLE;
    }

    U.el('#login').classList.add('hide');
    U.el('#app').classList.add('on');

    const who = Cloud.email ? Cloud.email.split('@')[0] : 'Local';
    U.el('#userName').textContent = Cloud.authed ? who : 'Working locally';
    U.el('#userRole').textContent = Cloud.authed
      ? ({admin:'Administrator',manager:'Manager',sales:'Sales'}[Cloud.role]||Cloud.role)
      : 'No database connected';
    U.el('#userAvatar').textContent = Cloud.authed ? U.initials(who) : 'SC';
    U.el('#btnLogout').hidden = !Cloud.authed;

    Router.buildNav();
    Router.start();
    Shell.paintStatus();

    if(!Cloud.configured){
      Shell.localBanner();
      return;
    }

    if(Cloud.queue.length) Cloud.flush();
    try{
      await Cloud.pullAll();
      Router.buildNav();
      Router.refresh();
    }catch(err){
      Cloud.setStatus('offline',err.message);
      UI.toast('warn','Could not load the latest',
        'Showing the copy stored on this device. '+err.message);
    }
  },

  /* Says plainly that edits are staying in this browser. Shown once per
     session so it informs without nagging. */
  localBanner(){
    if(sessionStorage.getItem('sc_local_seen')) return;
    try{ sessionStorage.setItem('sc_local_seen','1'); }catch(e){}
    setTimeout(()=>UI.toast('info','Working locally',
      'No database is connected, so the portal is showing the content that ships with '+
      'the website. Changes are saved in this browser only.'),700);
  },

  boot(){
    /* icons in the static chrome */
    U.el('#burger').innerHTML = ICON.menu;
    U.el('#btnLogout').innerHTML = ICON.logout;
    U.el('#btnPreview').innerHTML = ICON.ext;
    U.el('#searchIcon').innerHTML = ICON.search;

    Cloud.init();
    Store.init();
    Shell.paintStatus();

    /* ---- sign in ---- */
    /* Wired whether or not a project is configured, because a project can be
       added without touching this code. */
    const form = U.el('#loginForm');
    const err  = U.el('#loginErr');
    const btn  = U.el('#loginBtn');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const email = U.el('#loginEmail').value.trim();
      const pass  = U.el('#loginPass').value;
      err.classList.remove('on');

      if(!email || !pass){
        err.textContent = 'Please fill in both boxes.';
        err.classList.add('on');
        return;
      }
      if(!Cloud.configured){
        err.textContent = 'This portal is not pointed at a Supabase project yet, so there '+
          'is nothing to sign in to. Fill in PROJECT near the top of the script.';
        err.classList.add('on');
        return;
      }

      btn.setAttribute('aria-busy','true');
      btn.innerHTML = '<span class="spin"></span>Signing in…';
      try{
        await Cloud.signIn(email,pass);
        await Shell.enter();
      }catch(ex){
        /* Supabase deliberately gives the same message for a wrong password and
           an address that does not exist. Say it plainly rather than guessing
           which it was. */
        err.textContent = /invalid login/i.test(ex.message)
          ? 'That email address and password do not match an account.'
          : ex.message;
        err.classList.add('on');
      }finally{
        btn.removeAttribute('aria-busy');
        btn.textContent = 'Sign in';
      }
    });

    U.el('#loginForgot').addEventListener('click', async () => {
      const email = U.el('#loginEmail').value.trim();
      if(!email){
        err.textContent = 'Type your email address first, then press this again.';
        err.classList.add('on');
        return;
      }
      /* The same answer either way, so this can never be used to find out
         which addresses have accounts. */
      try{ await Cloud.sendReset(email); }catch(ex){}
      err.classList.remove('on');
      UI.toast('ok','Check your email','If that address has an account, a reset link is on its way.');
    });

    /* ---- chrome ---- */
    U.el('#burger').addEventListener('click',Shell.openSidebar);
    U.el('#scrim').addEventListener('click',Shell.closeSidebar);
    U.el('#btnPreview').addEventListener('click',()=>window.open(WEBSITE_URL,'_blank','noopener'));

    U.el('#btnLogout').addEventListener('click',U.guard(async()=>{
      if(Cloud.queue.length){
        if(!await UI.confirm({
          title:'There are unsent changes',
          message:Cloud.queue.length+' change'+(Cloud.queue.length===1?'':'s')+
                  ' have not reached the database yet.',
          note:'They stay on this device and are sent next time you sign in here.',
          confirmText:'Sign out anyway',tone:'dan'
        })) return;
      }
      await Cloud.signOut();
      Shell.lock('You have been signed out.');
    }));

    U.el('#syncPill').addEventListener('click',()=>location.hash = '#/database');

    /* ---- global search ---- */
    const search = U.el('#globalSearch');
    search.addEventListener('keydown',e=>{
      if(e.key === 'Enter'){
        const q = search.value.trim();
        if(!q) return;
        /* Send it wherever it is most likely to be useful. A number that
           looks like a phone number goes to the enquiries, anything else to
           the stock list. */
        const digits = q.replace(/[^0-9]/g,'');
        const target = (digits.length >= 9) ? 'enquiries' : 'vehicles';
        location.hash = '#/'+target+'?q='+encodeURIComponent(q);
        search.blur();
      }
      if(e.key === 'Escape'){ search.value = ''; search.blur(); }
    });

    /* "/" focuses the search from anywhere that is not already a field. */
    document.addEventListener('keydown',e=>{
      if(e.key !== '/') return;
      const t = e.target.tagName;
      if(t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      if(!U.el('#app').classList.contains('on')) return;
      e.preventDefault();
      search.focus();
    });

    /* Warn before leaving with work that has not reached the database. */
    window.addEventListener('beforeunload',e=>{
      if(Cloud.authed && Cloud.queue.length){
        e.preventDefault();
        e.returnValue = '';
      }
    });

    /* ---- go ---- */
    /* Configured but not signed in means the sign-in screen. Everything else
       enters directly: either there is a session, or there is no database to
       protect. */
    if(!Cloud.configured || Cloud.authed) Shell.enter();
    else Shell.lock();
  }
};

/* Keep the sidebar badges honest whatever changed them. */
Store.on('*',()=>{ if(Router.current) Router.paintBadges(); });

document.addEventListener('DOMContentLoaded',Shell.boot);

})();
</script>
</body>
</html>
