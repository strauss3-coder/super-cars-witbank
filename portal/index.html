/* ==================================================================
   MODULE  ·  Analytics
   Reads the vehicle_views table the website writes to, plus the lead
   tables. No third party tracker and no cookie banner needed.
   ================================================================== */
Portal.register({
  id:'analytics', title:'Analytics', sub:'What buyers are doing', icon:'chart',
  group:'Overview', instant:true,
  state:{ days:30 },

  render(){
    const days = this.state.days;
    const since = Date.now() - days*86400000;
    const views = Store.list('views').filter(v=>v.at >= since);
    const vehicles = Store.list('vehicles');
    const byId = {};
    vehicles.forEach(v=>byId[v.id] = v);

    const enq = Store.list('enquiries').filter(e=>!e.archived && e.createdAt >= since);
    const fin = Store.list('financeApps').filter(f=>!f.archived && f.createdAt >= since);
    const tin = Store.list('tradeins').filter(t=>!t.archived && t.createdAt >= since);
    const leads = enq.length + fin.length + tin.length;

    /* Views per day, for the bar chart. */
    const buckets = {};
    for(let i=days-1;i>=0;i--){
      const d = new Date(Date.now() - i*86400000);
      buckets[d.toISOString().slice(0,10)] = 0;
    }
    views.forEach(v=>{
      const k = new Date(v.at).toISOString().slice(0,10);
      if(k in buckets) buckets[k]++;
    });
    const series = Object.keys(buckets).map(k=>({d:k,n:buckets[k]}));
    const peak = Math.max(1,...series.map(s=>s.n));

    /* Views per vehicle in the window. */
    const perVeh = {};
    views.forEach(v=>{ perVeh[v.vehicleId] = (perVeh[v.vehicleId]||0)+1; });
    const ranked = Object.keys(perVeh)
      .map(id=>({v:byId[id],n:perVeh[id]}))
      .filter(x=>x.v)
      .sort((a,b)=>b.n-a.n).slice(0,8);

    /* Which body types and makes draw the most interest. */
    const byBody = {}, byMake = {};
    ranked.forEach(()=>{});
    Object.keys(perVeh).forEach(id=>{
      const v = byId[id]; if(!v) return;
      if(v.body) byBody[v.body] = (byBody[v.body]||0)+perVeh[id];
      if(v.make) byMake[v.make] = (byMake[v.make]||0)+perVeh[id];
    });

    const conv = views.length ? ((leads/views.length)*100).toFixed(1) : '0.0';

    return `
    ${H.head('Analytics','How buyers are using your website.',`
      <div class="tabs">
        ${[7,30,90].map(d=>`<button class="tab ${d===days?'on':''}" data-days="${d}">${d} days</button>`).join('')}
      </div>`)}

    ${!Store.list('views').length ? `
      <div class="note info" style="margin-bottom:14px">${ICON.info}
        <div>No page views have been recorded yet. The website starts writing them the
        moment it is live and someone opens a vehicle page. Everything below will fill in
        on its own.</div></div>` : ''}

    <div class="stats" style="margin-bottom:14px">
      ${H.stat({label:'Vehicle page views',count:views.length,icon:'eye',tone:'acc',
        sub:`<span>Last ${days} days</span>`})}
      ${H.stat({label:'Leads received',count:leads,icon:'inbox',tone:leads?'ok':'',
        sub:`<span>${enq.length} enquiries &middot; ${fin.length} finance &middot; ${tin.length} trade-ins</span>`})}
      ${H.stat({label:'Views per lead',value:leads?Math.round(views.length/leads):'—',icon:'activity',
        sub:`<span>${conv}% of views become a lead</span>`})}
      ${H.stat({label:'Views all time',count:Store.stats().views,icon:'chart',
        sub:'<span>Across every vehicle</span>'})}
    </div>

    ${H.card('Views per day',`Last ${days} days`, series.some(s=>s.n)
      ? `<div style="display:flex;align-items:flex-end;gap:${days>60?'1px':'3px'};height:150px">
          ${series.map(s=>`
            <div title="${U.date(s.d)}: ${s.n} view${s.n===1?'':'s'}"
                 style="flex:1;min-width:0;height:${Math.max(2,Math.round((s.n/peak)*100))}%;
                        background:${s.n?'var(--acc)':'var(--raise-2)'};border-radius:2px 2px 0 0;
                        transition:height .5s var(--ease-out)"></div>`).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:8px">
          <span>${U.date(series[0].d)}</span>
          <span>Peak ${peak} in a day</span>
          <span>${U.date(series[series.length-1].d)}</span>
        </div>`
      : H.empty('chart','Nothing in this window','No vehicle pages were opened in the last '+days+' days.'))}

    <div class="grid" style="grid-template-columns:1.3fr 1fr;align-items:start;margin-top:14px" data-cols>
      ${H.card('Most viewed vehicles',`Last ${days} days`,
        ranked.length ? `<div class="rank">${ranked.map((r,i)=>`
          <div class="rank-row">
            <div class="rank-top"><span class="rank-n">${i+1}</span>
              <b>${U.esc(vehName(r.v))}</b><span>${r.n}</span></div>
            <div class="meter"><i data-w="${Math.round((r.n/ranked[0].n)*100)}%"></i></div>
          </div>`).join('')}</div>`
        : H.empty('car','No views yet','This fills in as customers browse your stock.'))}

      <div class="grid" style="gap:14px">
        ${H.card('Interest by body type','',
          Object.keys(byBody).length ? breakdown(byBody)
          : H.empty('car','Nothing yet','Body types will rank here once pages are viewed.'))}
        ${H.card('Interest by make','',
          Object.keys(byMake).length ? breakdown(byMake)
          : H.empty('tag','Nothing yet','Makes will rank here once pages are viewed.'))}
      </div>
    </div>

    <div style="margin-top:14px">
      ${H.card('Where leads came from',`Last ${days} days`,
        leads ? `<div class="rank">${
          Object.entries(
            [].concat(
              enq.map(e=>e.source||'Website'),
              fin.map(()=>'Finance page'),
              tin.map(()=>'Sell my car page')
            ).reduce((a,s)=>{ a[s]=(a[s]||0)+1; return a; },{})
          ).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`
            <div class="rank-row">
              <div class="rank-top"><b>${U.esc(k)}</b><span>${n}</span></div>
              <div class="meter ok"><i data-w="${Math.round((n/leads)*100)}%"></i></div>
            </div>`).join('')
        }</div>`
        : H.empty('inbox','No leads in this window','Enquiries, finance applications and trade-in requests will be counted here.'))}
    </div>`;

    function breakdown(obj){
      const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,6);
      const top = entries[0][1];
      return `<div class="rank">${entries.map(([k,n])=>`
        <div class="rank-row">
          <div class="rank-top"><b>${U.esc(k)}</b><span>${n}</span></div>
          <div class="meter warn"><i data-w="${Math.round((n/top)*100)}%"></i></div>
        </div>`).join('')}</div>`;
    }
  },

  mount(root){
    U.on(root,'click','[data-days]',(e,b)=>{
      this.state.days = Number(b.dataset.days);
      Router.refresh();
    });
    const fit = ()=>U.els('[data-cols]',root).forEach(g=>{
      g.style.gridTemplateColumns = window.innerWidth < 1000 ? 'minmax(0,1fr)' : '1.3fr 1fr';
    });
    fit();
    if(this._onResize) window.removeEventListener('resize',this._onResize);
    this._onResize = U.debounce(fit,180);
    window.addEventListener('resize',this._onResize);
  }
});

/* ==================================================================
   MODULE  ·  Vehicle Management
   Full CRUD over the stock the website lists. Photographs, ordering,
   status flags, bulk actions, CSV in and out.
   ================================================================== */
Portal.register({
  id:'vehicles', title:'Vehicle Management', sub:'Your stock list', icon:'car',
  group:'Inventory', skeleton:'cards',
  badge(st){ return st.available ? {text:String(st.available),mut:true} : null; },
  state:{ q:'', tab:'all', make:'', sort:'order', view:'grid', sel:[] },

  render(params){
    if(params.q != null && params.q !== '') this.state.q = params.q;
    if(params.tab) this.state.tab = params.tab;

    const s = this.state;
    const all = Store.list('vehicles');

    const counts = {
      all:       all.filter(v=>!v.archived).length,
      available: all.filter(v=>!v.archived && !v.sold && !v.reserved).length,
      featured:  all.filter(v=>!v.archived && v.featured).length,
      reserved:  all.filter(v=>!v.archived && v.reserved && !v.sold).length,
      sold:      all.filter(v=>v.sold).length,
      drafts:    all.filter(v=>v.archived).length,
      nophotos:  all.filter(v=>!v.archived && !v.images.length).length,
      noprice:   all.filter(v=>!v.archived && !v.price).length
    };

    let list = all.filter(v=>{
      switch(s.tab){
        case 'available': return !v.archived && !v.sold && !v.reserved;
        case 'featured':  return !v.archived && v.featured;
        case 'reserved':  return !v.archived && v.reserved && !v.sold;
        case 'sold':      return v.sold;
        case 'drafts':    return v.archived;
        case 'nophotos':  return !v.archived && !v.images.length;
        case 'noprice':   return !v.archived && !v.price;
        default:          return !v.archived;
      }
    });

    if(s.make) list = list.filter(v=>v.make === s.make);

    if(s.q){
      const terms = s.q.toLowerCase().split(/\s+/).filter(Boolean);
      list = list.filter(v=>{
        const hay = [v.make,v.model,v.variant,v.year,v.stock,v.vin,v.colour,
                     v.body,v.fuel,v.transmission].join(' ').toLowerCase();
        return terms.every(t=>hay.indexOf(t) > -1);
      });
    }

    list = list.slice().sort((a,b)=>{
      switch(s.sort){
        case 'price-desc': return (b.price||0)-(a.price||0);
        case 'price-asc':  return (a.price||Infinity)-(b.price||Infinity);
        case 'newest':     return (b.createdAt||0)-(a.createdAt||0);
        case 'views':      return (b.views||0)-(a.views||0);
        case 'name':       return vehName(a).localeCompare(vehName(b));
        default:           return (a.sortOrder||0)-(b.sortOrder||0);
      }
    });

    const makes = [...new Set(all.map(v=>v.make).filter(Boolean))].sort();
    const selCount = s.sel.length;

    return `
    ${H.head('Vehicle Management',`${counts.all} on the website, ${counts.sold} sold.`,`
      <button class="btn" data-act="import">${ICON.upload} Import CSV</button>
      <button class="btn" data-act="export">${ICON.download} Export CSV</button>
      <button class="btn btn-pri" data-act="add">${ICON.plus} Add a vehicle</button>`)}

    <div class="card" style="margin-bottom:14px">
      <div class="card-b" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <div class="tabs" style="flex:1;min-width:220px">
          ${[
            {k:'all',l:'All',n:counts.all},
            {k:'available',l:'Available',n:counts.available},
            {k:'featured',l:'Featured',n:counts.featured},
            {k:'reserved',l:'Reserved',n:counts.reserved},
            {k:'sold',l:'Sold',n:counts.sold},
            {k:'drafts',l:'Drafts',n:counts.drafts}
          ].map(t=>`<button class="tab ${s.tab===t.k?'on':''}" data-tab="${t.k}">${t.l}<span class="n">${t.n}</span></button>`).join('')}
        </div>
      </div>
      ${(counts.nophotos || counts.noprice) ? `
        <div class="card-b" style="padding-top:0;display:flex;gap:8px;flex-wrap:wrap">
          ${counts.nophotos?`<button class="pill dan" data-tab="nophotos" style="cursor:pointer">${ICON.warn} ${counts.nophotos} with no photographs</button>`:''}
          ${counts.noprice?`<button class="pill warn" data-tab="noprice" style="cursor:pointer">${ICON.warn} ${counts.noprice} with no price</button>`:''}
        </div>` : ''}
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-b" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <div style="flex:1;min-width:200px">
          <input class="inp" id="vq" placeholder="Search make, model, stock number or VIN" value="${U.esc(s.q)}">
        </div>
        <select class="sel" id="vmake" style="width:auto;min-width:130px">
          <option value="">Every make</option>
          ${makes.map(m=>`<option ${m===s.make?'selected':''}>${U.esc(m)}</option>`).join('')}
        </select>
        <select class="sel" id="vsort" style="width:auto;min-width:150px">
          ${[
            {v:'order',l:'Website order'},{v:'newest',l:'Newest first'},
            {v:'price-desc',l:'Price: high to low'},{v:'price-asc',l:'Price: low to high'},
            {v:'views',l:'Most viewed'},{v:'name',l:'Name A to Z'}
          ].map(o=>`<option value="${o.v}" ${s.sort===o.v?'selected':''}>${o.l}</option>`).join('')}
        </select>
        <div class="tabs" style="padding:2px">
          <button class="tab ${s.view==='grid'?'on':''}" data-view="grid">Grid</button>
          <button class="tab ${s.view==='list'?'on':''}" data-view="list">List</button>
        </div>
      </div>
      ${selCount ? `
        <div class="card-b" style="padding-top:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <b style="font-size:12.5px">${selCount} selected</b>
          <button class="btn btn-sm" data-bulk="feature">Feature</button>
          <button class="btn btn-sm" data-bulk="unfeature">Unfeature</button>
          <button class="btn btn-sm" data-bulk="sold">Mark sold</button>
          <button class="btn btn-sm" data-bulk="available">Mark available</button>
          <button class="btn btn-sm" data-bulk="archive">Archive</button>
          <button class="btn btn-sm btn-dan" data-bulk="delete">Delete</button>
          <button class="btn btn-sm btn-ghost" data-bulk="none">Clear selection</button>
        </div>` : ''}
    </div>

    ${list.length ? (s.view === 'grid' ? gridView(list,s) : listView(list,s))
      : H.card('','',H.empty('car',
          s.q || s.make ? 'Nothing matches that' : 'No vehicles here yet',
          s.q || s.make ? 'Try a different search, or clear the filters.'
                        : 'Add your first vehicle and it appears on the website straight away.',
          `<button class="btn btn-pri btn-sm" data-act="${s.q||s.make?'clear':'add'}">${
            s.q||s.make ? 'Clear filters' : ICON.plus+' Add a vehicle'}</button>`))}

    ${list.length ? `<p class="hint" style="margin-top:14px;text-align:center">
      Showing ${list.length} of ${all.length} vehicles.
      ${s.sort==='order'?'Drag a card to change the order they appear in on the website.':''}
    </p>` : ''}`;

    /* ---- card grid ---- */
    function gridView(list,s){
      return `<div class="grid" id="vgrid" style="grid-template-columns:repeat(auto-fill,minmax(266px,1fr))">
        ${list.map(v=>`
          <div class="card" data-id="${v.id}" ${s.sort==='order'?'draggable="true"':''}
               style="${s.sel.indexOf(v.id)>-1?'border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)':''}">
            <div style="position:relative;aspect-ratio:4/3;background:var(--raise-2);overflow:hidden">
              ${v.images.length
                ? `<img src="${U.esc(v.images[0])}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">`
                : `<div style="display:grid;place-items:center;height:100%;color:var(--text-3)">${ICON.image}</div>`}
              <div style="position:absolute;top:9px;left:9px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 60px)">
                ${badges(v)}
              </div>
              <label style="position:absolute;top:9px;right:9px;cursor:pointer">
                <input type="checkbox" data-sel="${v.id}" ${s.sel.indexOf(v.id)>-1?'checked':''}
                  style="width:19px;height:19px;accent-color:var(--acc);cursor:pointer">
              </label>
              ${v.images.length>1?`<span class="pill" style="position:absolute;bottom:9px;right:9px;background:rgba(0,0,0,.7);color:#fff">${v.images.length} photos</span>`:''}
            </div>
            <div class="card-b" style="padding:13px">
              <b style="display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(vehName(v))}</b>
              <small style="display:block;font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">${U.esc(v.variant||'No variant set')}</small>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px">
                <div>
                  <b style="font-size:16px;font-weight:790;letter-spacing:-.02em">${v.price?U.money(v.price):'<span style="color:var(--warn);font-size:13px">No price</span>'}</b>
                  <small style="display:block;font-size:11px;color:var(--text-3)">${v.stock?'Stock '+U.esc(v.stock):''}${v.mileage?' &middot; '+U.km(v.mileage):''}</small>
                </div>
                <div class="sp" style="gap:2px">
                  <button class="icon-act" data-edit="${v.id}" title="Edit">${ICON.edit}</button>
                  <button class="icon-act" data-more="${v.id}" title="More">${ICON.grip}</button>
                </div>
              </div>
            </div>
          </div>`).join('')}
      </div>`;
    }

    /* ---- table ---- */
    function listView(list,s){
      return `<div class="card"><div class="card-b flush"><div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th style="width:34px"><input type="checkbox" data-sel-all style="width:16px;height:16px;accent-color:var(--acc)"></th>
          <th>Vehicle</th><th>Stock</th><th class="num">Price</th><th class="num">Mileage</th>
          <th>Status</th><th class="num">Views</th><th style="width:80px"></th>
        </tr></thead>
        <tbody>
          ${list.map(v=>`<tr data-id="${v.id}">
            <td><input type="checkbox" data-sel="${v.id}" ${s.sel.indexOf(v.id)>-1?'checked':''} style="width:16px;height:16px;accent-color:var(--acc)"></td>
            <td><div class="veh-row">
              ${v.images.length?`<img class="veh-thumb" src="${U.esc(v.images[0])}" alt="" loading="lazy">`
                : `<div class="veh-thumb" style="display:grid;place-items:center;color:var(--text-3)">${ICON.image}</div>`}
              <div style="min-width:0"><b>${U.esc(vehName(v))}</b><small>${U.esc(v.variant||'')}</small></div>
            </div></td>
            <td><span class="pill">${U.esc(v.stock||'—')}</span></td>
            <td class="num">${v.price?U.money(v.price):'<span style="color:var(--warn)">—</span>'}</td>
            <td class="num">${v.mileage?U.num(v.mileage):'—'}</td>
            <td><div style="display:flex;gap:4px;flex-wrap:wrap">${badges(v)}</div></td>
            <td class="num">${U.num(v.views||0)}</td>
            <td><div class="sp" style="gap:2px">
              <button class="icon-act" data-edit="${v.id}" title="Edit">${ICON.edit}</button>
              <button class="icon-act" data-more="${v.id}" title="More">${ICON.grip}</button>
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table></div></div></div>`;
    }

    function badges(v){
      const out = [];
      if(v.archived)      out.push('<span class="pill warn">Draft</span>');
      else if(v.sold)     out.push('<span class="pill">Sold</span>');
      else if(v.reserved) out.push('<span class="pill warn">Reserved</span>');
      else                out.push('<span class="pill ok">Live</span>');
      if(v.featured) out.push('<span class="pill acc">Featured</span>');
      if(v.promoted) out.push('<span class="pill info">Promoted</span>');
      if(!v.images.length && !v.archived) out.push('<span class="pill dan">No photos</span>');
      return out.join('');
    }
  },

  mount(root){
    const s = this.state;

    U.on(root,'click','[data-tab]',(e,b)=>{ s.tab = b.dataset.tab; s.sel = []; Router.refresh(); });
    U.on(root,'click','[data-view]',(e,b)=>{ s.view = b.dataset.view; Router.refresh(); });
    U.on(root,'click','[data-act="add"]',()=>Modules.vehicleForm(null));
    U.on(root,'click','[data-act="clear"]',()=>{ s.q=''; s.make=''; s.tab='all'; Router.refresh(); });
    U.on(root,'click','[data-act="export"]',()=>Modules.exportVehicles());
    U.on(root,'click','[data-act="import"]',()=>Modules.importVehicles());
    U.on(root,'click','[data-edit]',(e,b)=>Modules.vehicleForm(Store.find('vehicles',b.dataset.edit)));
    U.on(root,'click','[data-more]',(e,b)=>Modules.vehicleMenu(Store.find('vehicles',b.dataset.more),b));

    const q = U.el('#vq',root);
    if(q){
      q.addEventListener('input',U.debounce(()=>{
        s.q = q.value;
        Router.refresh();
        /* Refresh rebuilds the input, so put the caret back where it was. */
        const again = U.el('#vq');
        if(again){ again.focus(); again.setSelectionRange(again.value.length,again.value.length); }
      },300));
    }
    const mk = U.el('#vmake',root);
    if(mk) mk.addEventListener('change',()=>{ s.make = mk.value; Router.refresh(); });
    const st = U.el('#vsort',root);
    if(st) st.addEventListener('change',()=>{ s.sort = st.value; Router.refresh(); });

    /* ---- selection ---- */
    U.on(root,'change','[data-sel]',(e,cb)=>{
      const id = cb.dataset.sel;
      const i = s.sel.indexOf(id);
      if(cb.checked && i < 0) s.sel.push(id);
      if(!cb.checked && i > -1) s.sel.splice(i,1);
      Router.refresh();
    });
    U.on(root,'change','[data-sel-all]',(e,cb)=>{
      s.sel = cb.checked ? U.els('[data-sel]',root).map(x=>x.dataset.sel) : [];
      Router.refresh();
    });
    U.on(root,'click','[data-bulk]',U.guard(async(e,b)=>{
      await Modules.bulkVehicles(b.dataset.bulk,s);
    }));

    /* ---- drag to reorder, only meaningful in website order ---- */
    const grid = U.el('#vgrid',root);
    if(grid && s.sort === 'order'){
      UI.sortable(grid,'.card[data-id]',ids=>{
        /* Only the visible cards were reordered. Splice them back into the
           full list so a filtered view cannot silently drop the rest. */
        const full = Store.list('vehicles');
        const moved = ids.map(id=>full.find(v=>v.id===id)).filter(Boolean);
        const rest = full.filter(v=>ids.indexOf(v.id) < 0);
        Store.replaceAll('vehicles',moved.concat(rest));
        Store.log('Stock order changed','The website now lists them in this order','car');
        UI.toast('ok','Order saved','The website will show them in this order');
      });
    }
  }
});

/* ==================================================================
   MODULES  ·  shared actions
   Dialogs and operations that more than one module reaches for.
   ================================================================== */
const Modules = {

  /* ---------------------------------------------------------------- */
  /* The vehicle editor. Every field here maps to a column the website
     reads, and every column the website reads has a field here.        */
  vehicleForm(v){
    const isNew = !v;
    /* Edit a copy. Nothing touches the store until Save is pressed, so
       closing the dialog genuinely discards the changes. */
    const d = Object.assign({
      id:'', stock:'', vin:'', make:'', model:'', variant:'', year:'',
      mileage:0, transmission:'', fuel:'', body:'', colour:'', engine:'',
      powerKw:'', seats:'', fuelUse:'', co2:'', zeroTo100:'', doors:'',
      price:0, priceBadge:'', costPrice:0, installment:0, financeEligible:true,
      description:'', features:[], images:[], video:'', serviceHistory:'',
      condition:'', notes:'', status:'available',
      featured:false, promoted:false, reserved:false, sold:false, archived:isNew,
      autotraderId:'', carszaId:'', slug:'', metaTitle:'', metaDescription:''
    }, v ? JSON.parse(JSON.stringify(v)) : {});

    let tab = 'basics';

    const close = UI.modal({
      title: isNew ? 'Add a vehicle' : 'Edit '+vehName(d),
      sub: isNew ? 'It stays a draft until you switch Draft off.' : (d.stock ? 'Stock '+d.stock : ''),
      wide:true, sticky:true,
      body:'<div data-vf></div>',
      footer:
        (isNew?'':'<button class="btn btn-ghost" data-vf-del>'+ICON.trash+' Delete</button>')+
        '<div style="flex:1"></div>'+
        '<button class="btn" data-vf-cancel>Cancel</button>'+
        '<button class="btn btn-pri" data-vf-save>'+ICON.check+' '+(isNew?'Add vehicle':'Save changes')+'</button>',
      onMount(body,closeFn,foot){
        paint();

        function paint(){
          body.innerHTML = `
            <div class="tabs" style="margin-bottom:16px">
              ${[['basics','Basics'],['specs','Specification'],['photos','Photographs'],
                 ['content','Description'],['status','Status and pricing'],['seo','SEO and listings'],
                 ['private','Private']].map(([k,l])=>
                `<button class="tab ${tab===k?'on':''}" data-vt="${k}">${l}${k==='photos'&&d.images.length?`<span class="n">${d.images.length}</span>`:''}</button>`).join('')}
            </div>
            <div data-vf-pane></div>`;
          U.el('[data-vf-pane]',body).innerHTML = pane();
          wirePane();
          U.on(body,'click','[data-vt]',(e,b)=>{ tab = b.dataset.vt; paint(); });
        }

        function pane(){
          if(tab === 'basics') return `
            <div class="grid" style="gap:13px">
              <div class="f2">
                ${H.field('Make',H.sel('make',d.make,[''].concat(MAKES)),'','required')}
                ${H.field('Model',H.input('model',d.model,'For example, Polo Vivo'),'','required')}
              </div>
              ${H.field('Variant or trim',H.input('variant',d.variant,'For example, Hatch 1.4 Trendline'),
                'Shown under the name on the website.')}
              <div class="f3">
                ${H.field('Year',H.input('year',d.year,'2021','number'))}
                ${H.field('Mileage (km)',H.input('mileage',d.mileage,'112000','number'))}
                ${H.field('Stock number',H.input('stock',d.stock,'0013'))}
              </div>
              <div class="f3">
                ${H.field('Transmission',H.sel('transmission',d.transmission,[''].concat(TRANS)))}
                ${H.field('Fuel',H.sel('fuel',d.fuel,[''].concat(FUELS)))}
                ${H.field('Body type',H.sel('body',d.body,[''].concat(BODIES)))}
              </div>
              <div class="f2">
                ${H.field('Colour',H.input('colour',d.colour,'White'))}
                ${H.field('Condition',H.sel('condition',d.condition,[''].concat(CONDS)))}
              </div>
            </div>`;

          if(tab === 'specs') return `
            <p class="hint" style="margin-bottom:14px">Anything left blank is simply left off the
            website rather than shown as an empty row.</p>
            <div class="grid" style="gap:13px">
              <div class="f2">
                ${H.field('Engine',H.input('engine',d.engine,'1.4 TSI'))}
                ${H.field('Maximum power (kW)',H.input('powerKw',d.powerKw,'85','number'))}
              </div>
              <div class="f3">
                ${H.field('Seats',H.input('seats',d.seats,'5','number'))}
                ${H.field('Doors',H.input('doors',d.doors,'5','number'))}
                ${H.field('0 to 100 (sec)',H.input('zeroTo100',d.zeroTo100,'10.2','number'))}
              </div>
              <div class="f2">
                ${H.field('Fuel use (l/100km)',H.input('fuelUse',d.fuelUse,'5.3','number'))}
                ${H.field('CO2 (g/km)',H.input('co2',d.co2,'126','number'))}
              </div>
              ${H.field('Service history',H.sel('serviceHistory',d.serviceHistory,HISTORY),
                'Shown on the vehicle page under Condition and history.')}
              ${H.field('Features',
                `<textarea class="ta" data-k="featuresText" rows="7" placeholder="One per line.">${U.esc((d.features||[]).join('\n'))}</textarea>`,
                'One per line. These become the tick list on the vehicle page.')}
            </div>`;

          if(tab === 'photos') return `
            <div class="upl">
              <div class="upl-drop" data-vf-drop tabindex="0" role="button">
                ${ICON.upload}
                <b>Add photographs</b>
                <span>Drag them here or tap to choose. They are resized automatically.</span>
              </div>
              <input type="file" accept="image/*" multiple hidden data-vf-file>
              ${d.images.length ? `
                <p class="hint">Drag to reorder. The first photograph is the one shown on the stock list.</p>
                <div class="upl-grid" data-vf-imgs>
                  ${d.images.map((src,i)=>`
                    <div class="upl-item" data-id="${i}" draggable="true">
                      <img src="${U.esc(src)}" alt="" loading="lazy">
                      <div class="bar">
                        <div style="flex:1"></div>
                        <button data-vf-view="${i}" title="View">${ICON.eye}</button>
                        <button data-vf-rm="${i}" title="Remove">${ICON.x}</button>
                      </div>
                      ${i===0?'<span class="main">MAIN</span>':''}
                    </div>`).join('')}
                </div>`
                : `<p class="hint">No photographs yet. A vehicle without pictures gets almost no enquiries.</p>`}
              ${H.field('Video link',H.input('video',d.video,'https://youtu.be/…'),
                'Optional. A YouTube link is embedded on the vehicle page.')}
            </div>`;

          if(tab === 'content') return `
            <div class="grid" style="gap:13px">
              ${H.field('Description',H.ta('description',d.description,
                'Describe the car the way you would to someone standing in front of it. Leave a blank line between paragraphs.',10),
                'Blank lines become separate paragraphs on the website.')}
            </div>`;

          if(tab === 'status') return `
            <div class="grid" style="gap:13px">
              <div class="f2">
                ${H.field('Selling price (R)',H.input('price',d.price,'189950','number'),
                  'Leave at zero to show "Price on request".')}
                ${H.field('Price badge',H.sel('priceBadge',d.priceBadge,BADGES),
                  'Shown as a green tag on the listing.')}
              </div>
              <div class="f2">
                ${H.field('Monthly instalment (R)',H.input('installment',d.installment,'0','number'),
                  'Leave at zero and the website works it out from your finance settings.')}
                ${H.field('Sold price / cost (R)',H.input('costPrice',d.costPrice,'0','number'),
                  'Private. Never shown on the website.')}
              </div>
              <div class="sep"></div>
              <div class="grid" style="gap:9px">
                ${H.toggleCard('archived',d.archived,'Draft','Hidden from the website until this is off','warn','archive')}
                ${H.toggleCard('featured',d.featured,'Featured','Shown in the featured row on the home page','acc','star')}
                ${H.toggleCard('promoted',d.promoted,'Promoted','Sorted higher in the stock list','info','sparkles')}
                ${H.toggleCard('reserved',d.reserved,'Reserved','Shown as reserved, still listed','warn','tag')}
                ${H.toggleCard('sold',d.sold,'Sold','Marked sold and sorted to the bottom','ok','checkCircle')}
                ${H.toggleCard('financeEligible',d.financeEligible,'Offer finance','Shows the finance estimate and Apply button','ok','bank')}
              </div>
            </div>`;

          if(tab === 'seo') return `
            <div class="grid" style="gap:13px">
              ${H.field('Web address (slug)',H.input('slug',d.slug,'2023-vw-polo-vivo-0011'),
                'The vehicle page address. Leave blank and one is generated when you save.')}
              ${H.field('Page title',H.input('metaTitle',d.metaTitle,''),
                'Leave blank to use the vehicle name. Around 60 characters works best.')}
              ${H.field('Search description',H.ta('metaDescription',d.metaDescription,'',3),
                'Leave blank and one is built from the specification. Around 155 characters.')}
              <div class="sep"></div>
              <p class="hint">If you also list this vehicle elsewhere, record the reference here so
              you can match them up later.</p>
              <div class="f2">
                ${H.field('AutoTrader reference',H.input('autotraderId',d.autotraderId,''))}
                ${H.field('Cars.co.za reference',H.input('carszaId',d.carszaId,''))}
              </div>
            </div>`;

          /* private */
          return `
            <div class="note warn" style="margin-bottom:14px">${ICON.shield}
              <div>Nothing on this tab reaches the website. The database refuses to send
              these columns to a visitor, so they cannot be read even by editing the request.</div></div>
            <div class="grid" style="gap:13px">
              ${H.field('VIN',H.input('vin',d.vin,'Chassis number'),'Private.')}
              ${H.field('Internal notes',H.ta('notes',d.notes,'Where it came from, what it owes you, what still needs doing.',5),'Private.')}
            </div>`;
        }

        function wirePane(){
          const pane = U.el('[data-vf-pane]',body);

          H.bind(pane,(k,val)=>{
            if(k === 'featuresText'){
              d.features = String(val).split('\n').map(x=>x.trim()).filter(Boolean);
            }else{
              d[k] = val;
            }
            /* Ticking Sold clears Reserved: a car cannot be both. */
            if(k === 'sold' && val) d.reserved = false;
            if(k === 'reserved' && val) d.sold = false;
          },()=>{ /* saved on Save, not as you type */ });

          /* photographs */
          const drop = U.el('[data-vf-drop]',pane);
          const file = U.el('[data-vf-file]',pane);
          if(drop && file){
            drop.addEventListener('click',()=>file.click());
            drop.addEventListener('keydown',e=>{
              if(e.key==='Enter'||e.key===' '){ e.preventDefault(); file.click(); }
            });
            ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
              e.preventDefault(); drop.classList.add('over');
            }));
            ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
              e.preventDefault(); drop.classList.remove('over');
            }));
            drop.addEventListener('drop',e=>addImages(e.dataTransfer.files));
            file.addEventListener('change',()=>{ addImages(file.files); file.value=''; });
          }

          U.on(pane,'click','[data-vf-rm]',U.guard(async(e,b)=>{
            const i = Number(b.dataset.vfRm);
            const url = d.images[i];
            if(await UI.confirm({title:'Remove this photograph?',
                message:'It is removed from the vehicle when you save, and deleted from storage.',
                confirmText:'Remove',tone:'dan'})){
              d.images.splice(i,1);
              /* Only delete from storage if nothing else still uses it. */
              const stillUsed = Store.list('vehicles').some(x=>x.id!==d.id && (x.images||[]).indexOf(url)>-1);
              if(!stillUsed) Cloud.removeImage(url);
              paint();
            }
          }));
          U.on(pane,'click','[data-vf-view]',(e,b)=>UI.lightbox(d.images,Number(b.dataset.vfView)));

          const imgs = U.el('[data-vf-imgs]',pane);
          if(imgs) UI.sortable(imgs,'.upl-item',ids=>{
            d.images = ids.map(i=>d.images[Number(i)]).filter(Boolean);
            paint();
          });

          async function addImages(files){
            const list = Array.prototype.slice.call(files||[]).filter(f=>/^image\//.test(f.type));
            if(!list.length) return;
            if(!Cloud.authed){
              UI.toast('err','Photographs need a database',
                'Uploading stores the file in Supabase. Connect a project first; '+
                'everything else on this page works without one.');
              return;
            }

            UI.toast('info','Uploading',list.length+' photograph'+(list.length===1?'':'s')+'…');
            for(const f of list){
              try{
                const mark = (Store.doc('business').name) || 'Super Cars Witbank';
                const img = await U.readImage(f,1600,.82,mark);
                const up = await Cloud.uploadImage('vehicle-images',img.dataUrl,'stock');
                d.images.push(up.url);
                /* Index it so the Media Library knows it exists. */
                Store.insert('media',{
                  id:U.id('m'), url:up.url, bucket:up.bucket, path:up.path,
                  name:(vehName(d)||'Vehicle')+' photo', folder:'vehicles',
                  kind:'image', bytes:up.bytes, width:img.width, height:img.height
                });
                paint();
              }catch(err){
                UI.toast('err','A photograph did not upload',err.message);
              }
            }
            UI.toast('ok','Photographs added','Remember to save the vehicle.');
          }
        }

        /* ---- footer actions ---- */
        U.el('[data-vf-cancel]',foot).addEventListener('click',closeFn);

        const del = U.el('[data-vf-del]',foot);
        if(del) del.addEventListener('click',U.guard(async()=>{
          if(await UI.confirm({
            title:'Delete this vehicle?',
            message:'It is removed from the website and from your records, along with its photographs.',
            note:'This cannot be undone. To take it off the website but keep the record, switch Draft on instead.',
            confirmText:'Delete for good',tone:'dan'
          })){
            Store.remove('vehicles',d.id);
            Store.log('Vehicle deleted',vehName(d),'trash','dan');
            closeFn();
            UI.toast('ok','Deleted',vehName(d)+' has been removed');
            Router.refresh();
          }
        }));

        U.el('[data-vf-save]',foot).addEventListener('click',U.guard(async(e)=>{
          if(!d.make || !d.model){
            UI.toast('err','Make and model are needed','A vehicle cannot be listed without them.');
            tab = 'basics'; paint();
            return;
          }
          const btn = e.currentTarget;
          btn.setAttribute('aria-busy','true');

          /* A slug addresses a public page and must be unique. Generate one
             if it is blank, and add a suffix rather than overwrite if the
             name collides with another vehicle. */
          if(!d.slug){
            let base = U.slug([d.year,d.make,d.model,d.variant,d.stock].filter(Boolean).join(' '));
            let slug = base, n = 2;
            while(Store.list('vehicles').some(x=>x.id!==d.id && x.slug===slug)) slug = base+'-'+(n++);
            d.slug = slug;
          }
          d.status = d.sold ? 'sold' : d.reserved ? 'reserved' : d.archived ? 'draft' : 'available';

          if(isNew){
            d.id = U.id('v');
            Store.insert('vehicles',d);
            Store.log('Vehicle added',vehName(d),'car','ok');
            UI.toast('ok','Vehicle added',d.archived
              ? 'Saved as a draft. Switch Draft off to publish it.'
              : 'It is on the website now.');
          }else{
            Store.update('vehicles',d.id,d);
            Store.log('Vehicle updated',vehName(d),'edit');
            UI.toast('ok','Saved','The website has been updated.');
          }
          closeFn();
          Router.refresh();
        }));
      }
    });
  },

  /* ---------------------------------------------------------------- */
  vehicleMenu(v,anchor){
    if(!v) return;
    UI.modal({
      title:vehName(v),
      sub:v.stock ? 'Stock '+v.stock : '',
      body:`<div class="grid" style="gap:8px">
        ${[
          {a:'edit',   i:'edit',       l:'Edit this vehicle',        s:'Open the full editor'},
          {a:'view',   i:'ext',        l:'View on the website',      s:'Open the public page'},
          {a:'feature',i:'star',       l:v.featured?'Remove from featured':'Add to featured', s:'Shown on the home page'},
          {a:'reserve',i:'tag',        l:v.reserved?'Cancel the reservation':'Mark reserved', s:'Still listed, shown as reserved'},
          {a:'sold',   i:'checkCircle',l:v.sold?'Mark as available':'Mark as sold',  s:'Sorted to the bottom of the list'},
          {a:'dup',    i:'copy',       l:'Duplicate',                s:'Copy everything except photographs and stock number'},
          {a:'archive',i:'archive',    l:v.archived?'Publish to the website':'Move to drafts', s:'Drafts are hidden from customers'},
          {a:'del',    i:'trash',      l:'Delete for good',          s:'Removes the record and its photographs',tone:'dan'}
        ].map(o=>`
          <button class="qa" data-vm="${o.a}" style="display:flex;align-items:center;gap:12px;padding:12px 13px">
            <span class="li-ic ${o.tone==='dan'?'dan':'acc'}" style="width:32px;height:32px">${ICON[o.i]}</span>
            <span style="min-width:0;text-align:left"><b style="display:block;font-size:13px">${U.esc(o.l)}</b>
            <small style="font-size:11.5px;color:var(--text-3)">${U.esc(o.s)}</small></span>
          </button>`).join('')}
      </div>`,
      onMount(body,close){
        U.on(body,'click','[data-vm]',U.guard(async(e,b)=>{
          const a = b.dataset.vm;
          if(a === 'edit'){ close(); return Modules.vehicleForm(v); }
          if(a === 'view'){
            window.open(WEBSITE_URL.replace('index.html','vehicle.html')+'?v='+
              encodeURIComponent(v.slug||v.id),'_blank','noopener');
            return;
          }
          if(a === 'feature'){
            Store.update('vehicles',v.id,{featured:!v.featured});
            Store.log(v.featured?'Removed from featured':'Added to featured',vehName(v),'star');
            UI.toast('ok','Saved',v.featured?'No longer featured':'Now featured on the home page');
          }
          if(a === 'reserve'){
            Store.update('vehicles',v.id,{reserved:!v.reserved,sold:false,
              status:!v.reserved?'reserved':'available'});
            UI.toast('ok','Saved',v.reserved?'No longer reserved':'Marked as reserved');
          }
          if(a === 'sold'){
            Store.update('vehicles',v.id,{sold:!v.sold,reserved:false,
              status:!v.sold?'sold':'available'});
            Store.log(v.sold?'Marked available':'Vehicle sold',vehName(v),'checkCircle','ok');
            UI.toast('ok','Saved',v.sold?'Back on sale':'Marked as sold. Well done.');
          }
          if(a === 'dup'){
            const copy = JSON.parse(JSON.stringify(v));
            copy.id = U.id('v');
            /* A duplicate must not share a stock number, a slug or the
               original's photographs, or deleting one would break the other. */
            copy.stock = ''; copy.slug = ''; copy.vin = '';
            copy.images = []; copy.views = 0;
            copy.archived = true; copy.sold = false; copy.reserved = false;
            copy.featured = false; copy.promoted = false;
            copy.createdAt = Date.now(); copy.updatedAt = Date.now();
            Store.insert('vehicles',copy);
            Store.log('Vehicle duplicated',vehName(v),'copy');
            close();
            UI.toast('ok','Duplicated','Saved as a draft. Add photographs and a stock number.');
            Router.refresh();
            return Modules.vehicleForm(copy);
          }
          if(a === 'archive'){
            Store.update('vehicles',v.id,{archived:!v.archived,
              status:!v.archived?'draft':'available'});
            UI.toast('ok','Saved',v.archived?'Published to the website':'Moved to drafts');
          }
          if(a === 'del'){
            if(await UI.confirm({
              title:'Delete this vehicle?',
              message:'It is removed from the website and from your records, along with its photographs.',
              note:'This cannot be undone. To hide it but keep the record, move it to drafts instead.',
              confirmText:'Delete for good',tone:'dan'
            })){
              Store.remove('vehicles',v.id);
              Store.log('Vehicle deleted',vehName(v),'trash','dan');
              UI.toast('ok','Deleted',vehName(v)+' has been removed');
            }else return;
          }
          close();
          Router.refresh();
        }));
      }
    });
  },

  /* ---------------------------------------------------------------- */
  async bulkVehicles(action,s){
    const ids = s.sel.slice();
    if(!ids.length) return;
    const n = ids.length;

    if(action === 'none'){ s.sel = []; return Router.refresh(); }

    if(action === 'delete'){
      if(!await UI.confirm({
        title:`Delete ${n} vehicle${n===1?'':'s'}?`,
        message:'They are removed from the website and from your records, along with their photographs.',
        note:'This cannot be undone.',
        confirmText:`Delete ${n}`,tone:'dan'
      })) return;
      ids.forEach(id=>Store.remove('vehicles',id));
      Store.log('Vehicles deleted',n+' removed','trash','dan');
      UI.toast('ok','Deleted',n+' vehicle'+(n===1?'':'s')+' removed');
    }else{
      const patch = {
        feature:   {featured:true},
        unfeature: {featured:false},
        sold:      {sold:true,reserved:false,status:'sold'},
        available: {sold:false,reserved:false,archived:false,status:'available'},
        archive:   {archived:true,status:'draft'}
      }[action];
      if(!patch) return;
      ids.forEach(id=>Store.update('vehicles',id,patch));
      Store.log('Bulk change',n+' vehicles: '+action,'edit');
      UI.toast('ok','Updated',n+' vehicle'+(n===1?'':'s')+' changed');
    }
    s.sel = [];
    Router.refresh();
  },

  /* ---------------------------------------------------------------- */
  exportVehicles(){
    const rows = [[
      'id','stock','vin','make','model','variant','year','mileage','transmission',
      'fuel','body','colour','engine','power_kw','seats','fuel_use','co2',
      'zero_to_hundred','doors','price','price_badge','cost_price','installment',
      'finance_eligible','description','features','images','video','service_history',
      'condition','notes','status','featured','promoted','reserved','sold','archived',
      'autotrader_id','carsza_id','slug','meta_title','meta_description','views','created_at'
    ]];
    Store.list('vehicles').forEach(v=>{
      rows.push([
        v.id,v.stock,v.vin,v.make,v.model,v.variant,v.year,v.mileage,v.transmission,
        v.fuel,v.body,v.colour,v.engine,v.powerKw,v.seats,v.fuelUse,v.co2,
        v.zeroTo100,v.doors,v.price,v.priceBadge,v.costPrice,v.installment,
        v.financeEligible?'yes':'no',v.description,(v.features||[]).join(' | '),
        (v.images||[]).join(' | '),v.video,v.serviceHistory,v.condition,v.notes,
        v.status,v.featured?'yes':'no',v.promoted?'yes':'no',v.reserved?'yes':'no',
        v.sold?'yes':'no',v.archived?'yes':'no',v.autotraderId,v.carszaId,v.slug,
        v.metaTitle,v.metaDescription,v.views,U.date(v.createdAt)
      ]);
    });
    U.save('super-cars-stock-'+U.dateInput(Date.now())+'.csv',U.csv(rows),'text/csv');
    UI.toast('ok','Exported',Store.list('vehicles').length+' vehicles downloaded');
  },

  /* CSV import. Matches on the stock number so re-importing an edited
     export updates rather than duplicating. Everything is previewed before
     a single record is written. */
  importVehicles(){
    UI.modal({
      title:'Import vehicles from CSV',
      sub:'Match on stock number. Existing vehicles are updated, new ones added.',
      wide:true,
      body:`
        <div class="note info" style="margin-bottom:14px">${ICON.info}
          <div>The easiest way is to export first, edit the file in a spreadsheet, then import
          it back. Column names must match the export. Photographs cannot be imported this
          way; add those in the editor.</div></div>
        <div class="upl-drop" data-imp-drop tabindex="0" role="button">
          ${ICON.upload}<b>Choose a CSV file</b><span>Or drag it here</span>
        </div>
        <input type="file" accept=".csv,text/csv" hidden data-imp-file>
        <div data-imp-preview style="margin-top:14px"></div>`,
      footer:'<button class="btn" data-imp-cancel>Cancel</button>'+
             '<button class="btn btn-pri" data-imp-go disabled>Import</button>',
      onMount(body,close,foot){
        let parsed = null;
        const drop = U.el('[data-imp-drop]',body);
        const file = U.el('[data-imp-file]',body);
        const prev = U.el('[data-imp-preview]',body);
        const go   = U.el('[data-imp-go]',foot);

        drop.addEventListener('click',()=>file.click());
        drop.addEventListener('keydown',e=>{
          if(e.key==='Enter'||e.key===' '){ e.preventDefault(); file.click(); }
        });
        ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
          e.preventDefault(); drop.classList.add('over');
        }));
        ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
          e.preventDefault(); drop.classList.remove('over');
        }));
        drop.addEventListener('drop',e=>read(e.dataTransfer.files[0]));
        file.addEventListener('change',()=>read(file.files[0]));
        U.el('[data-imp-cancel]',foot).addEventListener('click',close);

        function read(f){
          if(!f) return;
          const fr = new FileReader();
          fr.onerror = ()=>UI.toast('err','Could not read that file','Try saving it again as CSV.');
          fr.onload = ()=>{
            const rows = U.parseCsv(fr.result);
            if(rows.length < 2){
              prev.innerHTML = `<div class="note dan">${ICON.warn}<div>That file has no data rows in it.</div></div>`;
              go.disabled = true;
              return;
            }
            const head = rows[0].map(h=>String(h).trim().toLowerCase());
            const need = ['make','model'];
            const missing = need.filter(c=>head.indexOf(c) < 0);
            if(missing.length){
              prev.innerHTML = `<div class="note dan">${ICON.warn}<div>The file is missing the
                <b>${missing.join('</b> and <b>')}</b> column${missing.length===1?'':'s'}.
                Export your stock first to see the format expected.</div></div>`;
              go.disabled = true;
              return;
            }

            const col = name=>head.indexOf(name);
            const get = (r,name)=>{ const i = col(name); return i < 0 ? '' : String(r[i]||'').trim(); };
            const yes = v=>/^(yes|true|1|y)$/i.test(String(v||'').trim());

            const existing = Store.list('vehicles');
            parsed = rows.slice(1).map(r=>{
              const stock = get(r,'stock');
              const byId = get(r,'id') && existing.find(x=>x.id === get(r,'id'));
              const byStock = stock && existing.find(x=>x.stock === stock);
              const match = byId || byStock || null;
              return {
                match:match,
                data:{
                  stock:stock, vin:get(r,'vin'),
                  make:get(r,'make'), model:get(r,'model'), variant:get(r,'variant'),
                  year:Number(get(r,'year'))||null, mileage:Number(get(r,'mileage'))||0,
                  transmission:get(r,'transmission'), fuel:get(r,'fuel'), body:get(r,'body'),
                  colour:get(r,'colour'), engine:get(r,'engine'),
                  powerKw:Number(get(r,'power_kw'))||'', seats:Number(get(r,'seats'))||'',
                  fuelUse:Number(get(r,'fuel_use'))||'', co2:Number(get(r,'co2'))||'',
                  zeroTo100:Number(get(r,'zero_to_hundred'))||'', doors:Number(get(r,'doors'))||'',
                  price:Number(String(get(r,'price')).replace(/[^0-9.]/g,''))||0,
                  priceBadge:get(r,'price_badge'),
                  costPrice:Number(String(get(r,'cost_price')).replace(/[^0-9.]/g,''))||0,
                  installment:Number(String(get(r,'installment')).replace(/[^0-9.]/g,''))||0,
                  financeEligible:col('finance_eligible') < 0 ? true : yes(get(r,'finance_eligible')),
                  description:get(r,'description'),
                  features:get(r,'features') ? get(r,'features').split('|').map(x=>x.trim()).filter(Boolean) : [],
                  video:get(r,'video'), serviceHistory:get(r,'service_history'),
                  condition:get(r,'condition'), notes:get(r,'notes'),
                  featured:yes(get(r,'featured')), promoted:yes(get(r,'promoted')),
                  reserved:yes(get(r,'reserved')), sold:yes(get(r,'sold')),
                  archived:col('archived') < 0 ? false : yes(get(r,'archived')),
                  autotraderId:get(r,'autotrader_id'), carszaId:get(r,'carsza_id'),
                  slug:get(r,'slug'), metaTitle:get(r,'meta_title'),
                  metaDescription:get(r,'meta_description')
                }
              };
            }).filter(x=>x.data.make && x.data.model);

            const updates = parsed.filter(p=>p.match).length;
            const adds = parsed.length - updates;

            prev.innerHTML = `
              <div class="note ok" style="margin-bottom:12px">${ICON.checkCircle}
                <div>Ready: <b>${adds}</b> new vehicle${adds===1?'':'s'} and
                <b>${updates}</b> update${updates===1?'':'s'}.
                Photographs are left exactly as they are.</div></div>
              <div class="tbl-wrap" style="max-height:280px;overflow-y:auto">
                <table class="tbl"><thead><tr>
                  <th>Vehicle</th><th>Stock</th><th class="num">Price</th><th>What happens</th>
                </tr></thead><tbody>
                  ${parsed.slice(0,60).map(p=>`<tr>
                    <td>${U.esc([p.data.year,p.data.make,p.data.model].filter(Boolean).join(' '))}</td>
                    <td>${U.esc(p.data.stock||'—')}</td>
                    <td class="num">${p.data.price?U.money(p.data.price):'—'}</td>
                    <td>${p.match?'<span class="pill warn">Update</span>':'<span class="pill ok">Add</span>'}</td>
                  </tr>`).join('')}
                </tbody></table>
              </div>
              ${parsed.length > 60 ? `<p class="hint" style="margin-top:8px">Showing the first 60 of ${parsed.length}.</p>` : ''}`;
            go.disabled = !parsed.length;
          };
          fr.readAsText(f);
        }

        go.addEventListener('click',U.guard(async()=>{
          if(!parsed || !parsed.length) return;
          go.setAttribute('aria-busy','true');
          let added = 0, updated = 0;
          parsed.forEach(p=>{
            if(p.match){
              Store.update('vehicles',p.match.id,p.data);
              updated++;
            }else{
              const rec = Object.assign({
                id:U.id('v'), images:[], views:0,
                status:p.data.sold?'sold':p.data.archived?'draft':'available'
              },p.data);
              if(!rec.slug){
                let base = U.slug([rec.year,rec.make,rec.model,rec.variant,rec.stock].filter(Boolean).join(' '));
                let slug = base, n = 2;
                while(Store.list('vehicles').some(x=>x.slug===slug)) slug = base+'-'+(n++);
                rec.slug = slug;
              }
              Store.insert('vehicles',rec);
              added++;
            }
          });
          Store.log('Stock imported',added+' added, '+updated+' updated','upload','ok');
          close();
          UI.toast('ok','Import finished',added+' added and '+updated+' updated');
          Router.refresh();
        }));
      }
    });
  }
};

/* ==================================================================
   LEAD INBOXES
   Enquiries, finance applications and trade-in requests. Three tables
   with different fields but the same working rhythm, so they share the
   list shell and the detail dialog below.
   ================================================================== */
const Inbox = {
  /* The header row every inbox shows. */
  filterBar(s,counts,statuses){
    return `<div class="card" style="margin-bottom:14px">
      <div class="card-b" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <div class="tabs" style="flex:1;min-width:220px">
          ${statuses.map(t=>`<button class="tab ${s.tab===t.k?'on':''}" data-tab="${t.k}">${t.l}<span class="n">${counts[t.k]||0}</span></button>`).join('')}
        </div>
        <input class="inp" id="iq" placeholder="Search name, phone or vehicle"
               value="${U.esc(s.q)}" style="width:auto;min-width:210px;flex:1">
      </div>
    </div>`;
  },

  /* The person block, identical in all three. */
  who(r){
    return `<div class="veh-row">
      <div class="avatar" style="width:36px;height:36px;font-size:12.5px">${U.esc(U.initials(r.name))}</div>
      <div style="min-width:0">
        <b>${U.esc(r.name||'No name given')}</b>
        <small>${U.esc([r.phone,r.email].filter(Boolean).join(' · ')||'No contact details')}</small>
      </div>
    </div>`;
  },

  contactBtns(r,waText){
    const out = [];
    if(r.phone){
      out.push(`<a class="btn btn-sm" href="tel:${U.esc(U.telHref(r.phone))}">${ICON.phone} Call</a>`);
      const wa = U.waNumber(r.phone);
      if(wa) out.push(`<a class="btn btn-sm" target="_blank" rel="noopener"
        href="https://wa.me/${wa}?text=${encodeURIComponent(waText||'')}">WhatsApp</a>`);
    }
    if(r.email){
      out.push(`<a class="btn btn-sm" href="mailto:${U.esc(r.email)}">${ICON.mail} Email</a>`);
    }
    return out.join('');
  },

  /* Shared detail dialog. `rows` describes what to show, `key` is the
     Store collection, so one dialog serves all three inboxes. */
  detail(key,r,opts){
    UI.modal({
      title:r.name || 'Lead',
      sub:U.dateTime(r.createdAt)+(r.source?' · '+r.source:''),
      wide:true,
      body:`
        <div class="grid" style="gap:14px">
          <div class="sp">${Inbox.contactBtns(r,opts.waText)}</div>
          ${opts.rows.length ? `<div class="card" style="background:var(--bg-2)"><div class="card-b">
            <div class="kv">${opts.rows.map(([k,v])=>
              `<div class="kv-row"><span>${U.esc(k)}</span><b>${v}</b></div>`).join('')}</div>
          </div></div>` : ''}
          ${r.message ? H.card('What they said','',
            `<p style="font-size:13.5px;line-height:1.65;color:var(--text-2);white-space:pre-wrap">${U.esc(r.message)}</p>`) : ''}
          ${opts.extra||''}
          ${H.field('Status',H.sel('status',r.status,opts.statusOpts))}
          ${H.field('Private notes',H.ta('notes',r.notes,'What you agreed, what happens next. Never shown to the customer.',4))}
        </div>`,
      footer:
        `<button class="btn btn-ghost" data-del>${ICON.trash} Delete</button>`+
        `<div style="flex:1"></div>`+
        `<button class="btn" data-archive>${ICON.archive} ${r.archived?'Restore':'Archive'}</button>`+
        `<button class="btn btn-pri" data-save>${ICON.check} Save</button>`,
      onMount(body,close,foot){
        const patch = {};
        H.bind(body,(k,v)=>{ patch[k] = v; },()=>{});

        U.el('[data-save]',foot).addEventListener('click',U.guard(async()=>{
          Store.update(key,r.id,patch);
          Store.log(opts.logTitle+' updated',r.name||'','edit');
          close();
          UI.toast('ok','Saved','This lead has been updated');
          Router.refresh();
        }));

        U.el('[data-archive]',foot).addEventListener('click',U.guard(async()=>{
          Store.update(key,r.id,{archived:!r.archived});
          close();
          UI.toast('ok',r.archived?'Restored':'Archived',
            r.archived?'Back in the active list':'Moved out of the active list');
          Router.refresh();
        }));

        U.el('[data-del]',foot).addEventListener('click',U.guard(async()=>{
          if(await UI.confirm({
            title:'Delete this record?',
            message:'The customer\'s details and everything they sent are removed.',
            note:'This cannot be undone. Archiving keeps the record but hides it.',
            confirmText:'Delete',tone:'dan'
          })){
            Store.remove(key,r.id);
            Store.log(opts.logTitle+' deleted',r.name||'','trash','dan');
            close();
            UI.toast('ok','Deleted','The record has been removed');
            Router.refresh();
          }
        }));

        /* Mark an unread lead as read the moment it is opened. */
        if(r.status === 'unread') Store.update(key,r.id,{status:'read'});
      }
    });
  },

  /* Filters a list by tab and search, shared by all three. */
  apply(list,s,tabTest){
    let out = list.filter(r=>tabTest(r,s.tab));
    if(s.q){
      const terms = s.q.toLowerCase().split(/\s+/).filter(Boolean);
      out = out.filter(r=>{
        const hay = [r.name,r.phone,r.email,r.vehicle,r.make,r.model,r.message].join(' ').toLowerCase();
        return terms.every(t=>hay.indexOf(t) > -1);
      });
    }
    return out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  },

  /* Keeps the caret in the search box across the re-render. */
  wireSearch(root,s){
    const q = U.el('#iq',root);
    if(!q) return;
    q.addEventListener('input',U.debounce(()=>{
      s.q = q.value;
      Router.refresh();
      const again = U.el('#iq');
      if(again){ again.focus(); again.setSelectionRange(again.value.length,again.value.length); }
    },300));
  }
};

const ENQ_STATUS = [
  {v:'unread',l:'Unread'},{v:'read',l:'Read'},

];

Portal.register({

      contacted:all.filter(e=>!e.archived && e.status==='contacted').length,

    U.on(root,'click','[data-tab]',(e,b)=>{ s.tab = b.dataset.tab; Router.refresh(); });
    U.on(root,'click','[data-act="readall"]',U.guard(async()=>{
      Store.list('enquiries').filter(e=>!e.archived && e.status==='unread')
        .forEach(e=>Store.update('enquiries',e.id,{status:'read'}));
      UI.toast('ok','All marked read','');
      Router.refresh();
    }));
    U.on(root,'click','[data-open]',(e,tr)=>{
      const r = Store.find('enquiries',tr.dataset.open);
      if(!r) return;
      Inbox.detail('enquiries',r,{
        logTitle:'Enquiry',
        statusOpts:ENQ_STATUS,
        waText:`Hello ${r.name||''}, thank you for your enquiry with Super Cars Witbank.`,
        rows:[
          ['About',{general:'A general question',vehicle:'A vehicle',testdrive:'A test drive',
                    reserve:'Reserving a vehicle',finance:'Finance'}[r.kind]||'General'],
          ['Vehicle',U.esc(r.vehicle||'Not specified')],
          ['Telephone',r.phone?`<a href="tel:${U.esc(U.telHref(r.phone))}" style="color:var(--acc-2)">${U.esc(r.phone)}</a>`:'—'],
          ['Email',r.email?`<a href="mailto:${U.esc(r.email)}" style="color:var(--acc-2)">${U.esc(r.email)}</a>`:'—'],
          ['Came from',U.esc(r.source||'Website')],
          ['Received',U.dateTime(r.createdAt)]
        ]
      });
    });
  }
});

function statusPill(s){
  const map = {
    unread:['dan','Unread'], read:['warn','Read'], contacted:['info','Contacted'],
    closed:['ok','Closed'], new:['dan','New'], reviewing:['warn','Reviewing'],
    submitted:['info','With the bank'], approved:['ok','Approved'], declined:['','Declined'],
    valuing:['warn','Valuing'], offered:['info','Offer made'],
    accepted:['ok','Accepted'], sold:['ok','Sold']
  };
  const [tone,label] = map[s] || ['','—'];
  return `<span class="pill ${tone}">${label}</span>`;
}

Portal.register({

  badge(st){ return st.tradeinNew ? {text:String(st.tradeinNew)} : null; },
  state:{ q:'', tab:'open' },

  render(){
    const s = this.state;
    const all = Store.list('tradeins');

      open:all.filter(t=>!t.archived && ['new','valuing','offered'].indexOf(t.status)>-1).length,
