<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Used Cars for Sale in Witbank | Super Cars Witbank</title>
<meta name="theme-color" content="#0E1116">
<link rel="canonical" href="https://www.supercars-witbank.co.za/inventory.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/premium.css">
</head>
<body data-page="inventory">

<a class="skip" href="#main">Skip to content</a>
<div class="read-bar" data-read-bar aria-hidden="true"></div>
<div data-announce></div>
<header class="hdr" data-header></header>

<main id="main">

  <section class="page-hero">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span aria-hidden="true">/</span>
        <span>Stock</span>
      </nav>
      <h1>Our current stock</h1>
      <p class="lead" data-stock-line>Every vehicle on our floor in eMalahleni.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="inv-layout">

        <!-- Filters. Options and counts are built from live stock, so a
             filter that would return nothing is never offered. -->
        <aside class="filters" id="filters" aria-label="Filter stock">
          <div class="filters-head">
            <b>Filters</b>
            <div class="row" style="gap:8px">
              <button class="btn btn-ghost btn-sm" data-clear-all type="button">Clear</button>
              <button class="filters-close" data-close-filters type="button" aria-label="Close filters"></button>
            </div>
          </div>
          <div class="filters-body" data-filters></div>
        </aside>

        <div>
          <div class="inv-bar">
            <label class="inv-search">
              <span class="sr">Search stock</span>
              <span data-search-icon></span>
              <input type="search" id="q" placeholder="Search make, model or keyword" autocomplete="off">
            </label>
            <div class="inv-tools">
              <button class="btn btn-out btn-sm filters-open" data-open-filters type="button">
                <span data-filter-icon></span> Filters <span data-filter-count></span>
              </button>
              <select class="sel" id="sort" aria-label="Sort stock">
                <option value="newest">Newest first</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="year-desc">Year: newest</option>
                <option value="year-asc">Year: oldest</option>
                <option value="km-asc">Mileage: lowest</option>
              </select>
              <button class="btn btn-out btn-sm" data-saved-toggle type="button" aria-pressed="false">
        <span data-heart-icon></span> <span data-saved-label>Saved</span>
      </button>
      <div class="view-tog" role="group" aria-label="Layout">
                <button data-view="grid" class="on" aria-label="Grid view" aria-pressed="true"></button>
                <button data-view="list" aria-label="List view" aria-pressed="false"></button>
              </div>
            </div>
          </div>

          <div class="chips" data-chips hidden></div>
          <p class="small" data-count style="margin-bottom:16px"></p>

          <div class="veh-grid" data-results></div>
          <div class="pager" data-pager></div>
        </div>

      </div>
    </div>
  </section>

</main>

<footer class="ftr" data-footer></footer>
<div data-wa-float></div>
<div data-compare-tray></div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/motion.js"></script>
<script src="js/fallback.js"></script>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script src="js/forms.js"></script>
<script src="js/vehicle-card.js"></script>
<script src="js/compare.js"></script>
<script src="js/inventory.js"></script>
</body>
</html>
