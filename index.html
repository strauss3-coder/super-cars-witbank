<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quality Pre-Owned Cars in Witbank | Super Cars Witbank</title>
<meta name="theme-color" content="#0E1116">
<link rel="canonical" href="https://www.supercars-witbank.co.za/">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="index">

<a class="skip" href="#main">Skip to content</a>
<header class="hdr" data-header></header>

<main id="main">

  <!-- Hero, search and headline figures. Every string comes from the
       Homepage Editor in the portal. -->
  <section class="hero" data-sec="hero">
    <div class="wrap">
      <div class="hero-grid">
        <div data-hero-copy>
          <div class="sk" style="height:34px;width:280px;border-radius:999px"></div>
          <div class="sk" style="height:62px;width:90%;margin-top:22px"></div>
          <div class="sk" style="height:62px;width:70%;margin-top:10px"></div>
          <div class="sk" style="height:20px;width:80%;margin-top:22px"></div>
        </div>
        <div data-hero-search></div>
      </div>
      <div class="hero-stats" data-hero-stats></div>
    </div>
  </section>

  <!-- Featured stock -->
  <section class="section" data-sec="featured" hidden>
    <div class="wrap">
      <div class="sec-head">
        <div class="t">
          <span class="eyebrow">On the floor</span>
          <h2 data-home="featuredTitle"></h2>
          <p class="lead" data-home="featuredSub"></p>
        </div>
        <a class="btn btn-out" href="inventory.html">View all stock</a>
      </div>
      <div class="veh-grid" data-featured></div>
    </div>
  </section>

  <!-- Finance -->
  <section class="section tight" data-sec="finance" hidden>
    <div class="wrap">
      <div class="cta cta-split">
        <div>
          <span class="eyebrow" style="color:var(--red-3)">Finance</span>
          <h2 data-home="financeTitle" style="margin-top:14px"></h2>
          <p data-home="financeText"></p>
        </div>
        <div class="row">
          <a class="btn btn-pri btn-lg" data-home-cta="financeCta"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- Latest arrivals -->
  <section class="section alt" data-sec="latest" hidden>
    <div class="wrap">
      <div class="sec-head">
        <div class="t">
          <span class="eyebrow">Just arrived</span>
          <h2 data-home="latestTitle"></h2>
          <p class="lead" data-home="latestSub"></p>
        </div>
        <a class="btn btn-out" href="inventory.html?sort=newest">See everything</a>
      </div>
      <div class="veh-grid" data-latest></div>
    </div>
  </section>

  <!-- Body types -->
  <section class="section" data-sec="categories" hidden>
    <div class="wrap">
      <div class="sec-head">
        <div class="t">
          <span class="eyebrow">Browse</span>
          <h2 data-home="categoriesTitle"></h2>
          <p class="lead" data-home="categoriesSub"></p>
        </div>
      </div>
      <div class="cat-grid" data-categories></div>
    </div>
  </section>

  <!-- Why buy from us -->
  <section class="section alt" data-sec="why" hidden>
    <div class="wrap">
      <div class="sec-head">
        <div class="t">
          <span class="eyebrow">Why us</span>
          <h2 data-home="whyTitle"></h2>
          <p class="lead" data-home="whySub"></p>
        </div>
      </div>
      <div class="grid g-2 why" data-why></div>
    </div>
  </section>

  <!-- Testimonials. Hides itself when the portal holds no published
       reviews, rather than showing filler. -->
  <section class="section" data-sec="testimonials" hidden>
    <div class="wrap">
      <div class="sec-head">
        <div class="t">
          <span class="eyebrow">Reviews</span>
          <h2 data-home="testimonialsTitle"></h2>
          <p class="lead" data-home="testimonialsSub"></p>
        </div>
        <a class="btn btn-out" href="testimonials.html">All reviews</a>
      </div>
      <div class="tm-grid" data-testimonials></div>
    </div>
  </section>

  <!-- About preview -->
  <section class="section alt" data-sec="about" hidden>
    <div class="wrap">
      <div class="grid g-2" style="align-items:center;gap:clamp(24px,4vw,56px)">
        <div class="stack" data-reveal>
          <span class="eyebrow">About us</span>
          <h2 data-home="aboutTitle"></h2>
          <p class="lead" data-home="aboutText"></p>
          <div class="row" style="margin-top:6px">
            <a class="btn btn-dark" data-home-cta="aboutCta"></a>
          </div>
        </div>
        <div data-about-rating></div>
      </div>
    </div>
  </section>

  <!-- Trade-in -->
  <section class="section" data-sec="tradein" hidden>
    <div class="wrap">
      <div class="cta cta-split">
        <div>
          <span class="eyebrow" style="color:var(--red-3)">Sell or trade in</span>
          <h2 data-home="tradeinTitle" style="margin-top:14px"></h2>
          <p data-home="tradeinText"></p>
        </div>
        <div class="row">
          <a class="btn btn-pri btn-lg" data-home-cta="tradeinCta"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- Contact and map -->
  <section class="section alt" data-sec="contact" hidden>
    <div class="wrap">
      <div class="sec-head">
        <div class="t">
          <span class="eyebrow">Visit us</span>
          <h2 data-home="contactTitle"></h2>
          <p class="lead" data-home="contactText"></p>
        </div>
      </div>
      <div class="grid g-2" style="align-items:start;gap:clamp(18px,2.4vw,30px)">
        <div data-contact-card></div>
        <div class="map-box" data-sec="map" hidden>
          <iframe title="Our location on Google Maps" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade" data-biz="mapEmbed"></iframe>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="ftr" data-footer></footer>
<div data-wa-float></div>

<noscript>
  <div class="wrap" style="padding:40px 0">
    <div class="note-bar warn">
      This site needs JavaScript to show current stock and prices.
      Please telephone us on 013 692 7628 and we will help you directly.
    </div>
  </div>
</noscript>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/fallback.js"></script>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script src="js/vehicle-card.js"></script>
<script src="js/home.js"></script>
</body>
</html>
