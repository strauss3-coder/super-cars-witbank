<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sell or Trade In Your Car in Witbank | Super Cars Witbank</title>
<meta name="theme-color" content="#0E1116">
<link rel="canonical" href="https://www.supercars-witbank.co.za/sell.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="sell">

<a class="skip" href="#main">Skip to content</a>
<header class="hdr" data-header></header>

<main id="main">

  <section class="page-hero">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span aria-hidden="true">/</span><span>Sell my car</span>
      </nav>
      <h1 data-sell="title">Sell or trade in your car</h1>
      <p class="lead" data-sell="subtitle"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="grid g-2" style="align-items:start;gap:clamp(24px,4vw,52px)">
        <div class="stack">
          <p class="lead" data-sell="intro"></p>
          <div data-points-block>
            <h2 class="h3" data-sell="pointsTitle" style="margin:14px 0 14px">Why sell to us</h2>
            <ul class="feat-list" style="grid-template-columns:minmax(0,1fr)" data-points></ul>
          </div>
        </div>
        <div data-steps-block>
          <h2 class="h3" data-sell="stepsTitle" style="margin-bottom:18px">Three steps</h2>
          <div data-steps></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section alt" id="valuation">
    <div class="wrap" style="max-width:820px">
      <div class="sec-head">
        <div class="t">
          <span class="eyebrow">Free valuation</span>
          <h2 data-sell="formTitle">Tell us about your car</h2>
          <p class="lead" data-sell="formNote"></p>
        </div>
      </div>
      <div class="vd-box"><div class="vd-box-b" data-sell-form></div></div>
    </div>
  </section>

</main>

<footer class="ftr" data-footer></footer>
<div data-wa-float></div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/fallback.js"></script>
<script src="js/data.js"></script>

<script src="js/forms.js"></script>
<script src="js/sell.js"></script>
</body>
