<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page Not Found | Super Cars Witbank</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1116">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/brand/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/brand/icon-180.png">
<!-- The first data request cannot start until the connection exists. Opening it
     while the HTML is still parsing takes that handshake off the critical path. -->
<link rel="preconnect" href="https://gbjuimzlbyznldhhqguc.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://gbjuimzlbyznldhhqguc.supabase.co">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/premium.css">
<script defer src="js/config.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/motion.js"></script>
<script defer src="js/fallback.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/site.js"></script>
<script defer src="js/vehicle-card.js"></script>
</head>
<body data-page="notfound">

<a class="skip" href="#main">Skip to content</a>
<div class="read-bar" data-read-bar aria-hidden="true"></div>
<div data-announce></div>
<header class="hdr" data-header></header>

<main id="main">
  <section class="section">
    <div class="wrap" style="max-width:620px;text-align:center">
      <div style="font-size:clamp(72px,14vw,128px);font-weight:850;letter-spacing:-.05em;
                  line-height:1;color:var(--red)">404</div>
      <h1 style="margin-top:12px">We cannot find that page</h1>
      <p class="lead" style="margin-top:14px">
        The link may be out of date, or a vehicle that was here has been sold.
        Our current stock is all on one page.
      </p>
      <div class="row" style="justify-content:center;margin-top:28px">
        <a class="btn btn-pri btn-lg" href="inventory.html">Browse our stock</a>
        <a class="btn btn-out btn-lg" href="index.html">Back to the home page</a>
      </div>
    </div>
  </section>

  <!-- Something useful rather than a dead end. -->
  <section class="section alt" data-suggest-sec hidden>
    <div class="wrap">
      <div class="sec-head">
        <div class="t">
          <span class="eyebrow">While you are here</span>
          <h2>A few from our floor</h2>
        </div>
        <a class="btn btn-out" href="inventory.html">See everything</a>
      </div>
      <div class="veh-grid" data-suggest></div>
    </div>
  </section>
</main>

<footer class="ftr" data-footer></footer>
<div data-wa-float></div>

<script>
/* Shows four current vehicles under the 404, so a bad link still leads
   somewhere useful instead of stopping the visit.

   Wrapped in DOMContentLoaded because the scripts above are deferred: they run
   after the document is parsed but before this event, so waiting for it is what
   guarantees SC exists by the time this needs it. */
document.addEventListener('DOMContentLoaded',function(){
  'use strict';
  var SC = window.SC, U = SC.U;
  Promise.all([SC.site, SC.data.settings(), SC.data.vehicles()]).then(function(r){
    var fin = r[1].finance || {};
    var list = r[2].filter(function(v){ return !v.sold; }).slice(0,4);
    if(!list.length) return;
    U.el('[data-suggest]').innerHTML = list.map(function(v,i){
      if(v.price > 0 && !v.installment) v.installment = SC.instalment(v.price, fin);
      return SC.vehicleCard(v,{delay:i%4});
    }).join('');
    U.el('[data-suggest-sec]').hidden = false;
    SC.scan(document); SC.fadeImages(document);
  }).catch(function(){ /* a 404 must never itself error */ });
});
</script>
</body>
</html>
